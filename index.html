                        <p class="mt-2 pt-2 border-t border-sky-500/15 text-slate-400">🙏 感謝協助測試，每一則回饋，都會讓 ZDOS 變得更好。</p>
                    </div>
                </div>
            </div>
            <div id="beta-feedback-actions" class="mt-5 flex gap-2">
                <button type="button" onclick="closeBetaFeedbackModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition-all">取消</button>
                <button type="button" id="beta-feedback-submit-btn" onclick="handleBetaFeedbackSubmit()" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white text-xs font-bold transition-all disabled:opacity-50 disabled:pointer-events-none">送出回饋</button>
            </div>
        </div>
    </div>

    <div id="root" class="relative z-10 w-full min-w-0 max-w-full min-h-screen flex flex-col justify-between p-2 sm:p-4"></div>

    <script src="ui/operation-center/operation-center-mock.js"></script>
    <script src="ui/operation-center/operation-center-workforce-provider.js"></script>
    <script src="ui/operation-center/operation-center-signal-registry.js"></script>
    <script src="ui/operation-center/operation-center-signal-provider.js"></script>
    <script src="ui/operation-center/operation-center-data-provider.js"></script>
    <script src="ui/operation-center/operation-center-ai-llm-shadow-adapter.js"></script>
    <script src="ui/operation-center/operation-center-ai-shadow-adapter.js"></script>
    <script src="ui/operation-center/operation-center-employee-ai-gateway-adapter.js"></script>
    <script src="ui/operation-center/operation-center-employee-ai-adapter.js"></script>
    <script src="ui/operation-center/operation-center-employee-ai-dev-harness.js"></script>
    <script>
        (function (g) {
            var KEY = 'zdos_feature_oc_employee_ai_eval_v1';
            try {
                if (!g.localStorage) return;
                var raw = g.localStorage.getItem(KEY);
                var cfg = raw ? JSON.parse(raw) : {};
                if (cfg.employeeAiEvalConsoleEnabled !== true) return;
                var s = g.document.createElement('script');
                s.src = 'ui/operation-center/operation-center-employee-ai-evaluation-console.js';
                s.defer = true;
                (g.document.head || g.document.documentElement).appendChild(s);
            } catch (_) { /* ignore */ }
        })(window);
    </script>
    <script src="ui/operation-center/operation-center-integration.js"></script>

    <script>
        // ========================================================================
        // 1. 全局常數與圖標庫
        // ========================================================================
        const THEMES = {
            'classic-blue': { glow1: 'bg-blue-600', glow2: 'bg-indigo-700', text: 'text-sky-400', border: 'border-sky-500/20', bg: 'bg-sky-500/5' }
        };

        const ROLE_OPTIONS = [
            '集團首腦', '區經理', '店經理', '店長', '領班', '副領班', '實習幹部', '一般員工'
        ];
        const LEADERSHIP_ACCOUNT_ROLES = new Set([
            '集團首腦', '區經理', '店經理', '店長', '領班', '副領班', '實習幹部'
        ]);
        const normalizeAccountRole = role => {
            const r = String(role || '').trim();
            if (!r) return '一般員工';
            if (LEADERSHIP_ACCOUNT_ROLES.has(r)) return r;
            if (r === '一般員工') return '一般員工';
            if (r === '資深員工' || r === '人資' || r === '總務' || r === '秘書') return '一般員工';
            return '一般員工';
        };
        const getAccountRoleLabel = role => normalizeAccountRole(role);

        // ========================================================================
        // Shift Registry（Architecture Rule #003）— 班別分類 ≠ 實際工時
        // timeRange 僅供排班分類、報表、AI 分析、班次篩選；實際上下班由 Schedule / Shift Template 決定
        // ========================================================================
        const SHIFT_REGISTRY = [
            {
                code: 'M',
                name: '早班',
                sortOrder: 1,
                timeRange: { start: '10:00', end: '14:59', wrapsDay: false },
                ui: { icon: '☀️' }
            },
            {
                code: 'A',
                name: '中班',
                sortOrder: 2,
                timeRange: { start: '15:00', end: '21:59', wrapsDay: false },
                ui: { icon: '⛅' }
            },
            {
                code: 'N',
                name: '晚班',
                sortOrder: 3,
                timeRange: { start: '22:00', end: '09:59', wrapsDay: true },
                ui: { icon: '🌙' }
            }
        ];

        const parseTimeToMinutes = hm => {
            const parts = String(hm || '').trim().split(':');
            const h = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10) || 0;
            if (Number.isNaN(h)) return null;
            return h * 60 + m;
        };

        // ========================================================================
        // Work Hour Rules（Feature-010E）— 8+1 / 10+1 班段（1h 空班含在 total span）
        // ========================================================================
        const WORK_SHIFT_RULE_PROFILES = {
            '8+1': {
                label: '8+1（8 小時工 + 1 小時空班）',
                workMinutes: 8 * 60,
                breakMinutes: 60,
                totalSpanHours: 9,
                scheduledMinutes: 9 * 60
            },
            '10+1': {
                label: '10+1（10 小時工 + 1 小時空班）',
                workMinutes: 10 * 60,
                breakMinutes: 60,
                totalSpanHours: 11,
                scheduledMinutes: 11 * 60
            }
        };

        const WORK_SHIFT_TYPE_OPTIONS = [
            { value: '8+1', label: '8+1' },
            { value: '10+1', label: '10+1' }
        ];

        const normalizeWorkShiftProfileKey = profileKey => {
            const key = String(profileKey || '').trim();
            if (key === 'normal' || key === '8+1') return '8+1';
            if (key === '10+1') return '10+1';
            return key;
        };

        const formatMinutesToHm = totalMinutes => {
            const dayMinutes = ((totalMinutes % (24 * 60)) + (24 * 60)) % (24 * 60);
            const h = Math.floor(dayMinutes / 60);
            const m = dayMinutes % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        };

        /**
         * 標準排班下班時間：上班 + total span（8+1 → 9h；10+1 → 11h，含 1h 空班）。
         */
        const calculateShiftEndTime = (startTime, options = {}) => {
            const profileKey = normalizeWorkShiftProfileKey(options.profile || '8+1');
            const profile = WORK_SHIFT_RULE_PROFILES[profileKey];
            if (!profile) {
                return {
                    ok: false,
                    startTime: '',
                    endTime: '',
                    crossesMidnight: false,
                    workMinutes: 0,
                    breakMinutes: 0,
                    scheduledMinutes: 0,
                    profile: profileKey,
                    error: 'unknown profile'
                };
            }
            const startMin = parseTimeToMinutes(startTime);
            if (startMin == null) {
                return {
                    ok: false,
                    startTime: '',
                    endTime: '',
                    crossesMidnight: false,
                    workMinutes: profile.workMinutes,
                    breakMinutes: profile.breakMinutes,
                    scheduledMinutes: profile.scheduledMinutes,
                    profile: profileKey,
                    error: 'invalid startTime'
                };
            }
            const endAbs = startMin + profile.scheduledMinutes;
            const crossesMidnight = endAbs >= 24 * 60;
            return {
                ok: true,
                startTime: formatMinutesToHm(startMin),
                endTime: formatMinutesToHm(endAbs),
                crossesMidnight,
                workMinutes: profile.workMinutes,
                breakMinutes: profile.breakMinutes,
                scheduledMinutes: profile.scheduledMinutes,
                totalSpanHours: profile.totalSpanHours,
                profile: profileKey
            };
        };

        const formatCalculatedShiftEndLabel = calc => {
            if (!calc?.ok) return '—';
            return calc.crossesMidnight ? `翌日 ${calc.endTime}` : calc.endTime;
        };

        const resolveShiftTemplateSchedule = (template, options = {}) => {
            if (!template) return null;
            const profileKey = normalizeWorkShiftProfileKey(options.profile || template.scheduleProfile || '8+1');
            if (profileKey === 'custom') {
                const startMin = parseTimeToMinutes(template.startTime);
                const endMin = parseTimeToMinutes(template.endTime);
                if (startMin == null || endMin == null) return null;
                const crossesMidnight = endMin <= startMin;
                return {
                    ok: true,
                    startTime: template.startTime,
                    endTime: template.endTime,
                    crossesMidnight,
                    workMinutes: template.workMinutes ?? null,
                    breakMinutes: template.breakMinutes ?? 0,
                    scheduledMinutes: crossesMidnight
                        ? (24 * 60 - startMin) + endMin
                        : endMin - startMin,
                    profile: 'custom'
                };
            }
            const calc = calculateShiftEndTime(template.startTime, { profile: profileKey });
            if (!calc.ok) return null;
            return {
                ...calc,
                breakMinutes: template.breakMinutes ?? calc.breakMinutes
            };
        };

        const getPersonnelDefaultShiftSchedule = emp => {
            if (!emp) return null;
            const tmpl = getShiftTemplate(emp.defaultShiftId);
            if (tmpl) return resolveShiftTemplateSchedule(tmpl);
            if (emp.defaultStartTime) return calculateShiftEndTime(emp.defaultStartTime, { profile: emp.defaultWorkShiftType || '8+1' });
            return null;
        };

        const resolveScheduleShiftCategoryCode = startTime => classifyShiftByTime(startTime) || 'M';

        const pickScheduleTemplateForStart = (storeId, startTime) => {
            const storeCode = normalizeStoreIdCode(storeId);
            const shiftCode = resolveScheduleShiftCategoryCode(startTime);
            return getDefaultShiftTemplate(storeCode, shiftCode)
                || getShiftTemplatesByStore(storeCode)[0]
                || null;
        };

        const resolveScheduleTimesFromPick = (startTime, workShiftType) => {
            const profile = normalizeWorkShiftProfileKey(workShiftType);
            return calculateShiftEndTime(startTime, { profile });
        };

        const getScheduleRecordTimes = schedule => {
            if (!schedule) return null;
            const tmpl = getShiftTemplate(schedule.templateId);
            const startTime = schedule.startTime || tmpl?.startTime || '';
            const workShiftType = normalizeWorkShiftProfileKey(schedule.workShiftType || tmpl?.scheduleProfile || '8+1');
            if (!startTime) return null;
            const calc = calculateShiftEndTime(startTime, { profile: workShiftType });
            return calc.ok ? { ...calc, workShiftType, shiftCategoryCode: schedule.shiftCode || resolveScheduleShiftCategoryCode(startTime) } : null;
        };

        const getShiftRegistry = () => SHIFT_REGISTRY;
        const getShiftByCode = code => SHIFT_REGISTRY.find(s => s.code === String(code || '').trim().toUpperCase()) || null;
        const getShiftByName = name => SHIFT_REGISTRY.find(s => s.name === String(name || '').trim()) || null;
        const resolveShift = ref => {
            if (!ref) return null;
            const key = String(ref).trim();
            return getShiftByCode(key) || getShiftByName(key);
        };
        const getDefaultShiftName = () => getShiftByCode('M')?.name || '早班';
        const formatShiftCategoryTimeRange = shift => {
            if (!shift?.timeRange) return '';
            const { start, end, wrapsDay } = shift.timeRange;
            return wrapsDay ? `${start} ~ 翌日 ${end}` : `${start} ~ ${end}`;
        };
        const isTimeInShiftCategoryRange = (minutes, timeRange) => {
            if (minutes == null || !timeRange) return false;
            const start = parseTimeToMinutes(timeRange.start);
            const end = parseTimeToMinutes(timeRange.end);
            if (start == null || end == null) return false;
            if (timeRange.wrapsDay) return minutes >= start || minutes <= end;
            return minutes >= start && minutes <= end;
        };
        const classifyShiftByTime = input => {
            const minutes = typeof input === 'number' ? input : parseTimeToMinutes(input);
            if (minutes == null) return null;
            for (const shift of SHIFT_REGISTRY) {
                if (isTimeInShiftCategoryRange(minutes, shift.timeRange)) return shift.code;
            }
            return null;
        };
        const getStoreShiftCodes = storeRef => {
            const store = resolveStore(storeRef);
            const codes = store?.features?.shiftCodes;
            return Array.isArray(codes) && codes.length ? codes : ['M'];
        };
        const renderShiftSelectOptions = (shiftCodes, selectedName = '') => {
            const selected = resolveShift(selectedName);
            return shiftCodes.map(code => {
                const shift = getShiftByCode(code);
                if (!shift) return '';
                const isSelected = selected ? selected.code === shift.code : selectedName === shift.name;
                return `<option value="${shift.name}" ${isSelected ? 'selected' : ''}>${shift.name}（${shift.code}） ${shift.ui.icon}</option>`;
            }).join('');
        };
        const renderStoreShiftOptions = (storeName, selected) => renderShiftSelectOptions(getStoreShiftCodes(storeName), selected);
        const renderShiftCategoryLegend = () => SHIFT_REGISTRY.map(shift =>
            `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-slate-950/60 border border-white/[0.05] text-[10px] text-slate-400"><span aria-hidden="true">${shift.ui.icon}</span><span class="font-mono text-slate-300">${shift.code}</span><span>${shift.name}</span><span class="text-slate-500">· 分類 ${formatShiftCategoryTimeRange(shift)}</span></span>`
        ).join('');

        // ========================================================================
        // Shift Template（Feature-008F）— 各門市實際上下班時間；班別分類仍由 SHIFT_REGISTRY 負責
        // ========================================================================
        const SHIFT_TEMPLATE = [
            { id: 'CH-M1', storeId: 'CH', shiftCode: 'M', name: '早班', startTime: '10:00', endTime: '19:00', breakMinutes: 60, defaultPosition: null, isDefault: true, status: 'active', sortOrder: 1, scheduleProfile: '8+1' },
            { id: 'CH-A1', storeId: 'CH', shiftCode: 'A', name: '中班', startTime: '15:00', endTime: '00:00', breakMinutes: 60, defaultPosition: null, isDefault: true, status: 'active', sortOrder: 2, scheduleProfile: '8+1' },
            { id: 'CH-N1', storeId: 'CH', shiftCode: 'N', name: '晚班', startTime: '22:00', endTime: '07:00', breakMinutes: 60, defaultPosition: null, isDefault: true, status: 'active', sortOrder: 3, scheduleProfile: '8+1' },
            { id: 'DG-M1', storeId: 'DG', shiftCode: 'M', name: '早班', startTime: '10:00', endTime: '19:00', breakMinutes: 60, defaultPosition: null, isDefault: true, status: 'active', sortOrder: 1, scheduleProfile: '8+1' },
            { id: 'DG-N1', storeId: 'DG', shiftCode: 'N', name: '晚班', startTime: '22:00', endTime: '07:00', breakMinutes: 60, defaultPosition: null, isDefault: true, status: 'active', sortOrder: 2, scheduleProfile: '8+1' }
        ];

        const sortShiftTemplates = list => [...list].sort((a, b) => a.sortOrder - b.sortOrder);
        const isShiftTemplateOvernight = template => {
            const sched = resolveShiftTemplateSchedule(template);
            return sched?.crossesMidnight === true;
        };
        const formatShiftTemplateWorkingTime = template => {
            const sched = resolveShiftTemplateSchedule(template);
            if (!sched?.ok) return '';
            return sched.crossesMidnight
                ? `${sched.startTime} ~ 翌日 ${sched.endTime}`
                : `${sched.startTime} ~ ${sched.endTime}`;
        };
        const getShiftTemplates = () => sortShiftTemplates(SHIFT_TEMPLATE.filter(t => t.status === 'active'));
        const getShiftTemplatesByStore = storeId => {
            const code = String(storeId || '').trim().toUpperCase();
            return sortShiftTemplates(SHIFT_TEMPLATE.filter(t => t.storeId === code && t.status === 'active'));
        };
        const getShiftTemplate = id => SHIFT_TEMPLATE.find(t => t.id === String(id || '').trim()) || null;
        const getDefaultShiftTemplate = (storeId, shiftCode) => {
            const store = String(storeId || '').trim().toUpperCase();
            const shift = String(shiftCode || '').trim().toUpperCase();
            const matches = sortShiftTemplates(SHIFT_TEMPLATE.filter(t =>
                t.storeId === store && t.shiftCode === shift && t.status === 'active'
            ));
            return matches.find(t => t.isDefault) || matches[0] || null;
        };

        // ========================================================================
        // Store Registry（Architecture Rule）— 唯一門市來源，禁止各模組寫死店別
        // ========================================================================
        const STORE_REGISTRY = [
            {
                code: 'CH',
                name: '中華店',
                status: 'active',
                configKey: 'zhonghua',
                features: { mobilePay: true, shiftCodes: ['M', 'A', 'N'] },
                ui: {
                    loginBtn: 'border-sky-500/40 bg-gradient-to-b from-sky-500/20 to-sky-600/10 hover:from-sky-500/30 hover:to-sky-600/20 text-sky-200',
                    badge: 'text-sky-300 border-sky-500/25 bg-sky-950/40',
                    reviewCard: 'border-sky-500/20 bg-sky-500/5',
                    reviewText: 'text-sky-400',
                    pendingBadge: 'bg-sky-950/50 border border-sky-500/20 text-[11px] text-sky-300',
                    statDot: 'bg-sky-500',
                    statAmount: 'text-sky-400',
                    configTabActive: 'bg-sky-950 text-sky-400'
                }
            },
            {
                code: 'DG',
                name: '東港店',
                status: 'active',
                configKey: 'donggang',
                features: { mobilePay: false, shiftCodes: ['M', 'N'] },
                ui: {
                    loginBtn: 'border-amber-500/40 bg-gradient-to-b from-amber-500/20 to-amber-600/10 hover:from-amber-500/30 hover:to-amber-600/20 text-amber-200',
                    badge: 'text-amber-300 border-amber-500/25 bg-amber-950/35',
                    reviewCard: 'border-amber-500/20 bg-amber-500/5',
                    reviewText: 'text-amber-400',
                    pendingBadge: 'bg-amber-950/50 border border-amber-500/20 text-[11px] text-amber-300',
                    statDot: 'bg-amber-500',
                    statAmount: 'text-amber-400',
                    configTabActive: 'bg-amber-950 text-amber-400'
                }
            },
            {
                code: 'HJ',
                name: '後勁店',
                status: 'coming_soon',
                comingSoonToast: '後勁店目前尚未開放',
                ui: {
                    loginBtn: 'border-emerald-500/20 bg-slate-900/55 text-slate-400',
                    reservedLabel: '尚未開放'
                }
            }
        ];

        const getStoreRegistry = () => STORE_REGISTRY;
        const getStoreByCode = code => STORE_REGISTRY.find(s => s.code === String(code || '').trim().toUpperCase()) || null;
        const getStoreByName = name => STORE_REGISTRY.find(s => s.name === name) || null;
        const resolveStore = ref => {
            if (!ref) return null;
            const key = String(ref).trim();
            return getStoreByCode(key.toUpperCase()) || getStoreByName(key) || null;
        };
        const normalizeStoreIdCode = ref => resolveStore(ref)?.code || null;
        const getActiveStores = () => STORE_REGISTRY.filter(s => s.status === 'active');
        const getStoresWithConfig = () => getActiveStores().filter(s => s.configKey);
        const getDefaultActiveStoreName = () => getActiveStores()[0]?.name || '';
        const isStoreActive = ref => resolveStore(ref)?.status === 'active';
        const isStoreComingSoon = ref => resolveStore(ref)?.status === 'coming_soon';
        const getComingSoonToast = ref => resolveStore(ref)?.comingSoonToast || `${resolveStore(ref)?.name || '此門市'}目前尚未開放`;
        const storeHasMobilePay = name => !!resolveStore(name)?.features?.mobilePay;
        const getStoreGoogleConfigKey = name => resolveStore(name)?.configKey || null;
        const getStoreGoogleConfig = name => {
            const key = getStoreGoogleConfigKey(name);
            return key ? state.googleFormSettings[key] : null;
        };
        const getStoreBadgeTone = name => resolveStore(name)?.ui?.badge || 'text-slate-300 border-white/[0.08] bg-slate-900/40';
        const getStoreReviewCardClass = name => resolveStore(name)?.ui?.reviewCard || 'border-white/[0.04] bg-slate-900/20';
        const getStoreReviewTextClass = name => resolveStore(name)?.ui?.reviewText || 'text-slate-300';
        const buildPendingCountByStore = records => {
            const counts = {};
            getActiveStores().forEach(s => { counts[s.name] = records.filter(r => r.store === s.name).length; });
            return counts;
        };
        const countPendingTotal = counts => Object.values(counts).reduce((sum, n) => sum + n, 0);
        const renderPendingCountSummary = counts => getActiveStores().map(s => `${s.name.replace('店', '')} ${counts[s.name] || 0}`).join(' · ');
        const renderPendingStoreBadges = counts => getActiveStores().map(s =>
            `<span class="inline-flex items-center px-2.5 py-1 rounded-lg ${s.ui.pendingBadge}">${s.name}：${counts[s.name] || 0} 筆</span>`
        ).join('');
        const renderActiveStoreStatsCards = salesRecords => getActiveStores().map(s => {
            const storeRecords = salesRecords.filter(r => r.store === s.name);
            const amount = storeRecords.reduce((acc, cur) => acc + safeFloat(cur.salesAmount), 0);
            return `<div class="p-6 bg-slate-900/40 border border-white/[0.04] rounded-2xl flex flex-col justify-between shadow-md">
                <div><div class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded-full ${s.ui.statDot}"></span><p class="text-xs text-slate-400 tracking-wider font-sans">${s.name}當月累計業績</p></div><h3 class="text-2xl font-extrabold ${s.ui.statAmount} mt-1 font-mono">$${amount.toLocaleString()}</h3></div>
                <div class="mt-4 pt-4 border-t border-white/[0.04] flex items-center justify-between text-[11px] text-slate-400 font-sans"><span>已錄入項目總筆數</span><span class="font-mono">${storeRecords.length} 班次</span></div>
            </div>`;
        }).join('');
        const renderStoreConfigTabButtons = activeTab => getStoresWithConfig().map(s =>
            `<button type="button" onclick="changeConfigTabDirect('${s.configKey}')" class="flex-1 py-1.5 text-[10px] font-bold rounded-lg ${activeTab === s.configKey ? s.ui.configTabActive : 'text-slate-400'}">🏬 ${s.name}</button>`
        ).join('');
        const renderComingSoonStoreConfigNotice = () => STORE_REGISTRY.filter(s => s.status === 'coming_soon').map(s =>
            `<p class="text-[10px] text-emerald-400/80">${s.name}（${s.code}）尚未開放，暫無雲端對接設定。</p>`
        ).join('');
        const renderStoreSelectOptions = (selected = '', includeNone = false) => {
            let html = '';
            if (includeNone) html += `<option value="無" ${selected === '無' ? 'selected' : ''}>無</option>`;
            STORE_REGISTRY.forEach(store => {
                if (store.status === 'active') {
                    html += `<option value="${store.name}" ${selected === store.name ? 'selected' : ''}>${store.name}（${store.code}）</option>`;
                } else if (store.status === 'coming_soon') {
                    html += `<option value="" disabled>${store.name}（${store.code}）尚未開放</option>`;
                }
            });
            return html;
        };
        const renderLoginStorePickerButtons = () => STORE_REGISTRY.map(store => {
            if (store.status === 'coming_soon') {
                return `<button type="button" onclick="handleReservedStoreSelect('${store.name}')" class="zdos-nav-btn w-full py-3.5 rounded-xl border ${store.ui.loginBtn} font-bold text-xs tracking-wide cursor-pointer flex flex-col items-center justify-center gap-0.5 active:scale-[0.98]">
                    <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full border border-emerald-500/40"></span><span>${store.name}（${store.code}）</span></span>
                    <span class="text-[9px] font-semibold text-emerald-300/85">${store.ui.reservedLabel || '尚未開放'}</span>
                </button>`;
            }
            return `<button type="button" onclick="handleLoginStoreSelect('${store.name}')" class="zdos-nav-btn w-full py-3.5 rounded-xl border ${store.ui.loginBtn} font-bold text-xs tracking-widest transition-all duration-200 cursor-pointer flex items-center justify-center gap-2 active:scale-[0.98]"><span class="w-2 h-2 rounded-full border border-current"></span><span>${store.name}（${store.code}）</span></button>`;
        }).join('');

        // ========================================================================

        const hydrateCloudSessionFromUser = async (authUser, inputEmp, options = {}) => {
            const userId = authUser?.id;
            if (!userId) return { ok: false, message: '登入狀態已失效，請重新登入' };
            state.authUser = authUser;
            const loaded = await fetchCloudProfileAndMemberships(userId);
            if (!loaded.ok) return loaded;
            state.cloudProfile = loaded.profile;
            if (inputEmp && !profileEmployeeNoMatchesInput(loaded.profile.employee_no, inputEmp)) {
                return { ok: false, message: '帳號資料與工號不一致，請聯絡管理者', mismatch: true };
            }
            // First-login force password change (DB state is the only source of truth).
            // Keep the authenticated session so auth.updateUser() can run, but do NOT
            // finalize login / enter any view until the password has been changed.
            if (loaded.profile.must_change_password === true) {
                state.mustChangePassword = true;
                state.supabaseSessionReady = false;
                state.isLoggedIn = false;
                state.forcePwd = { newPassword: '', confirmPassword: '', showNew: false, showConfirm: false, submitting: false, error: '' };
                return { ok: true, mustChangePassword: true };
            }
            state.mustChangePassword = false;
            const preferred = options.preferredStoreName || safeGetItem('shield_store_type', null);
            const storeEntry = pickDefaultCloudStore(loaded.profile, loaded.available, preferred);

        const performCloudLoginSubmit = async (inputEmp, inputPassword) => {
            if (state.cloudLoginInProgress) return;
            state.cloudLoginInProgress = true;
            renderApp();
            const client = getSupabaseClient();
            try {
                const email = resolveBetaAuthEmail(inputEmp);
                if (!email) {
                    if (typeof isAuth004LegacyEmployeeNo === 'function' && isAuth004LegacyEmployeeNo(inputEmp)) {
                        showToast('舊工號已停用，請改用新工號登入。', 'error');
                    } else {
                        showToast('此工號尚未開通雲端帳號，請聯絡管理者。', 'error');
                    }
                    return;
                }
                const { data, error } = await client.auth.signInWithPassword({
                    email,
                    password: inputPassword
                });
                if (error) {
                    console.error('[ZDOS cloud] signIn failed', error);
                    showToast(mapSupabaseAuthErrorToUserMessage(error), 'error');
                    try { await client.auth.signOut(); } catch (_) { /* ignore */ }
                    clearCloudAuthState({ keepClient: true });
                    return;
                }
                const authUser = data?.user;
                if (!authUser?.id) {
                    showToast('雲端連線失敗，請稍後再試', 'error');
                    return;
                }
                const result = await hydrateCloudSessionFromUser(authUser, inputEmp, { silent: false });
                if (!result.ok) {
                    console.error('[ZDOS cloud] post-auth validation failed', result.message);
                    try { await client.auth.signOut(); } catch (_) { /* ignore */ }
                    clearCloudAuthState({ keepClient: true });
                    state.isLoggedIn = false;
                    safeSetItem('shield_is_logged_in', 'false');
                    showToast(result.message, 'error');
                }
            } catch (err) {
                console.error('[ZDOS cloud] login unexpected', err);
                showToast('雲端連線失敗，請稍後再試', 'error');
                try { await client?.auth.signOut(); } catch (_) { /* ignore */ }
                clearCloudAuthState({ keepClient: true });
            } finally {
                state.cloudLoginInProgress = false;
                state.password = '';
                renderApp();
            }
        };

        const initCloudAuthOnBoot = async () => {
            if (!isSalesCloudEnabled() || zdosCloudAuthBootInFlight) return;
            zdosCloudAuthBootInFlight = true;
            const client = getSupabaseClient();
            if (!client) {
                zdosCloudAuthBootInFlight = false;
                return;
            }
            if (!zdosCloudAuthListenerAttached) {
                zdosCloudAuthListenerAttached = true;
                client.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_OUT') {
                        clearCloudAuthState({ keepClient: true });
                        state.isLoggedIn = false;
                        state.employeeId = '';
                        state.storeType = null;
                        safeSetItem('shield_is_logged_in', 'false');
                        safeSetItem('shield_store_type', '');
                        safeSetItem('shield_employee_id', '');
                        renderApp();
                    }
                });
            }
            state.isLoggedIn = false;
            try {
                const { data: { session }, error } = await client.auth.getSession();
                if (error) {
                    console.error('[ZDOS cloud] getSession failed', error);
                    clearCloudAuthState({ keepClient: true });
                    safeSetItem('shield_is_logged_in', 'false');
                    return;
                }
                if (!session?.user) {
                    clearCloudAuthState({ keepClient: true });
                    safeSetItem('shield_is_logged_in', 'false');
                    return;
                }
                const result = await hydrateCloudSessionFromUser(session.user, null, { restore: true, silent: true });
                if (!result.ok) {
                    console.error('[ZDOS cloud] session restore failed', result.message);
                    await client.auth.signOut();
                    clearCloudAuthState({ keepClient: true });
                    safeSetItem('shield_is_logged_in', 'false');
                }
            } finally {
                zdosCloudAuthBootInFlight = false;
            }
        };

        };

        const buildSalesReportsQueryFilters = prefs => {
            const p = prefs || loadSalesCloudPrefs();
            const y = Number(p.viewYear);
            const m = Number(p.viewMonth);
            const start = `${y}-${String(m).padStart(2, '0')}-01`;
            const endDay = new Date(y, m, 0).getDate();
            const end = `${y}-${String(m).padStart(2, '0')}-${String(endDay).padStart(2, '0')}`;
            return { start, end, prefs: p };
        };

        const getAccessibleCloudStoreUuids = () => {
            if (state.supabaseSessionReady && state.cloudAvailableStores?.length) {
                const map = state.supabaseStoreUuidByCode || {};
                return state.cloudAvailableStores.map(s => map[s.code]).filter(Boolean);
            }
            const user = getLoggedInAccount();
            if (!user) return [];
            const codes = getUserSchedulingStoreCodes();
            const map = state.supabaseStoreUuidByCode || {};
            return codes.map(c => map[c]).filter(Boolean);
        };

        const fetchCloudSalesReports = async (prefsOverride = null) => {
            if (!isSalesCloudEnabled() || !state.supabaseSessionReady) {
                return { ok: false, message: '雲端業績未就緒。' };
            }
            state.salesCloudLoading = true;
            try {
                await ensureSupabaseStoreUuidMap();
                const { start, end, prefs } = buildSalesReportsQueryFilters(prefsOverride || state.salesCloudPrefs);
                const storeUuids = getAccessibleCloudStoreUuids();
                if (!storeUuids.length) {
                    applyCloudSalesRows([]);
                    return { ok: true, rows: [] };
                }
                let query = getSupabaseClient()
                    .from('sales_reports')
                    .select('*')
                    .gte('business_date', start)
                    .lte('business_date', end)
                    .in('store_id', storeUuids)
                    .order('business_date', { ascending: false })
                    .order('submitted_at', { ascending: false });
                if (prefs.storeCode && state.supabaseStoreUuidByCode[prefs.storeCode]) {
                    query = query.eq('store_id', state.supabaseStoreUuidByCode[prefs.storeCode]);
                }
                if (prefs.status && prefs.status !== 'all') {
                    const cloudStatus = mapUiStatusToCloud(prefs.status);
                    query = query.eq('status', cloudStatus);
                }
                const { data, error } = await query;
                if (error) throw error;
                let rows = data || [];
                if (prefs.submitter && prefs.submitter !== 'all') {
                    const key = normalizeEmpId(prefs.submitter);
                    rows = rows.filter(r => normalizeEmpId(r?.submitter_profile?.employee_no) === key);
                }
                applyCloudSalesRows(rows);
                state.salesCloudPrefs = prefs;
                saveSalesCloudPrefs(prefs);
                return { ok: true, rows };
            } catch (err) {
                console.error(err);
                return { ok: false, message: err?.message || '載入雲端業績失敗。' };
            } finally {
                state.salesCloudLoading = false;
            }
        };

        const subscribeSalesReportsRealtime = () => {
            if (!isSalesCloudEnabled() || !state.supabaseSessionReady) return;
            if (state.salesReportsRealtimeChannel) return;
            const client = getSupabaseClient();
            const channel = client
                .channel('zdos-sales-reports-live')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'sales_reports' }, () => {
                    void fetchCloudSalesReports();
                })
                .subscribe();
            state.salesReportsRealtimeChannel = channel;
        };

        const findCloudDuplicateReport = async ({ storeCode, businessDate, shift, reportType = 'daily_shift', excludeId = null }) => {
            await ensureSupabaseStoreUuidMap();
            const storeId = state.supabaseStoreUuidByCode?.[normalizeStoreIdCode(storeCode)];
            if (!storeId) return null;
            let query = getSupabaseClient()
                .from('sales_reports')
                .select('id, status, business_date, shift, report_type')
                .eq('store_id', storeId)
                .eq('business_date', businessDate)
                .eq('shift', shift)
                .eq('report_type', reportType)
                .in('status', ['draft', 'submitted', 'approved', 'rejected']);
            if (excludeId) query = query.neq('id', excludeId);
            const { data, error } = await query.maybeSingle();
            if (error && error.code !== 'PGRST116') throw error;
            return data || null;
        };

        const insertCloudSalesReport = async payload => {
            if (!state.supabaseSessionReady) return { ok: false, message: '登入狀態已失效，請重新登入' };
            if (state.salesCloudSubmitting) return { ok: false, message: '正在送出，請稍候。' };
            state.salesCloudSubmitting = true;
            try {
                const storeEntry = state.cloudCurrentStore;
                if (!storeEntry?.id) return { ok: false, message: '登入狀態已失效，請重新登入' };
                const allowed = (state.cloudAvailableStores || []).some(s => s.id === storeEntry.id);
                if (!allowed) return { ok: false, message: '所屬門市目前未啟用' };
                const storeCode = storeEntry.code;
                if (payload.storeCode && normalizeStoreIdCode(payload.storeCode) !== storeCode) {
                    return { ok: false, message: '業績送出失敗，資料尚未寫入雲端' };

                await ensureSupabaseStoreUuidMap();
                const storeId = storeEntry.id;
                if (!storeId) return { ok: false, message: '門市無法對應雲端。' };
                const dup = await findCloudDuplicateReport({
                    storeCode,
                    businessDate: payload.businessDate,
                    shift: payload.shift,
                    reportType: payload.reportType || 'daily_shift'
                });
                if (dup) {
                    return { ok: false, message: '同店、同日、同班別已有業績紀錄，請修改原紀錄。', duplicateId: dup.id };
                }
                const clientRequestId = crypto.randomUUID();
                const { data: userData, error: userError } = await getSupabaseClient().auth.getUser();
                if (userError || !userData?.user?.id) {
                    return { ok: false, message: '登入狀態已失效，請重新登入' };
                }
                const uid = userData.user.id;
                const insertRow = {
                    client_request_id: clientRequestId,
                    store_id: storeId,
                    business_date: payload.businessDate,
                    shift: payload.shift,
                    report_type: payload.reportType || 'daily_shift',
                    revenue: payload.revenue,
                    customer_count: payload.customerCount ?? null,
                    cash_amount: payload.cashAmount ?? null,
                    digital_amount: payload.digitalAmount ?? null,
                    other_amount: payload.otherAmount ?? null,
                    note: payload.note || '',
                    status: payload.status || 'submitted',
                    submitted_by: uid,
                    submitted_at: new Date().toISOString()
                };
                const { data, error } = await getSupabaseClient()
                    .from('sales_reports')
                    .insert(insertRow)
                    .select('id')
                    .single();
                if (error) {
                    console.error('[ZDOS cloud] insert sales_reports failed', error);
                    return { ok: false, message: '業績送出失敗，資料尚未寫入雲端' };

                await fetchCloudSalesReports();
                return { ok: true, id: data?.id };
            } catch (err) {
                console.error('[ZDOS cloud] insert unexpected', err);
                return { ok: false, message: '業績送出失敗，資料尚未寫入雲端' };
            } finally {
                state.salesCloudSubmitting = false;
            }
        };

                    digital_amount: payload.digitalAmount ?? null,
                    other_amount: payload.otherAmount ?? null,

                    modified_at: new Date().toISOString()
                };
                const { data: userData } = await getSupabaseClient().auth.getUser();
                patch.modified_by = userData?.user?.id || null;
                if (payload.status) patch.status = payload.status;
                if (payload.rejection_reason !== undefined) patch.rejection_reason = payload.rejection_reason;
                if (payload.approved_by !== undefined) patch.approved_by = payload.approved_by;
                if (payload.approved_at !== undefined) patch.approved_at = payload.approved_at;
                if (payload.status === 'voided') {

                    patch.voided_by = userData?.user?.id || null;
                    patch.voided_at = new Date().toISOString();

                return { ok: false, message: err?.message || '雲端更新失敗。' };

        const generateCalendar = (year, month) => {
            const monthIndex = month - 1;
            const firstWeekday = new Date(year, monthIndex, 1).getDay();
            const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
            const cells = [];
            for (let i = 0; i < firstWeekday; i += 1) cells.push({ day: '', muted: true, today: false });
            const now = new Date();
            const isCurrentMonth = now.getFullYear() === year && (now.getMonth() + 1) === month;
            const todayDay = isCurrentMonth ? now.getDate() : null;
            for (let day = 1; day <= daysInMonth; day += 1) {
                cells.push({
                    day,
                    muted: false,
                    today: todayDay === day,
                    dateStr: `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`
                });
            }
            while (cells.length % 7 !== 0) cells.push({ day: '', muted: true, today: false });
            return cells;
        };
