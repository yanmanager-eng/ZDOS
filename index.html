<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZDOS v1.0.2 中東營運系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隱藏滾動條但保持功能 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        /* 強效防溢出機制 */
        input, select, textarea {
            box-sizing: border-box !important;
            max-width: 100% !important;
        }

        /* 網格背景紋理 */
        .premium-grid {
            background-color: #030712;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.008) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.008) 1px, transparent 1px);
            background-size: 24px 30px;
            background-position: center;
        }

        /* 絲滑脈衝動畫 */
        @keyframes subtle-pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.01); opacity: 1; }
        }
        .animate-subtle { animation: subtle-pulse 5s ease-in-out infinite; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* 跑馬燈滾動動畫 */
        @keyframes marquee {
            0% { transform: translate3d(100%, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            padding-left: 10px;
            animation: marquee 16s linear infinite;
        }
        .marquee-content:hover {
            animation-play-state: paused;
        }

        /* Feature-006A-1：RWD 全局工具 class */
        .zdos-modal-panel {
            max-height: 90vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .zdos-table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            max-width: 100%;
        }

        .zdos-table-scroll--sales table {
            min-width: 640px;
        }

        .zdos-table-scroll--inv table {
            min-width: 520px;
        }

        @media (max-width: 479px) {
            .zdos-modal-panel {
                max-height: 90vh;
            }
        }

        /* Feature-006B-1：UX 互動 — 滑動與頁面過渡 */
        html, body {
            overscroll-behavior-y: auto;
            overscroll-behavior-x: none;
            touch-action: manipulation;
        }

        @keyframes zdosViewEnter {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .zdos-view-enter {
            animation: zdosViewEnter 180ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @media (prefers-reduced-motion: reduce) {
            .zdos-view-enter {
                animation: none;
            }
        }

        /* Feature-006B-2：App Header — Sticky + Glass + 靜態陰影 */
        .zdos-app-header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.28),
                0 1px 0 rgba(255, 255, 255, 0.04);
        }

        @supports not (backdrop-filter: blur(1px)) {
            .zdos-app-header {
                background: rgba(15, 23, 42, 0.95);
            }
        }

        /* Feature-006B-2 修正：手機不 sticky 大型 Header，Module 僅工具列 sticky */
        @media (max-width: 767px) {
            .zdos-app-header:not(.zdos-app-header--toolbar) {
                position: relative;
                top: auto;
            }
        }

        /* Feature-006B-2 修正：防止根層水平溢出（不遮蓋表格區域內部 scroll） */
        html {
            max-width: 100%;
            overflow-x: clip;
        }

        body {
            max-width: 100%;
        }

        #glow-1,
        #glow-2 {
            position: fixed !important;
            pointer-events: none;
        }

        #root,
        .zdos-app-header,
        .zdos-view-body {
            min-width: 0;
            max-width: 100%;
            box-sizing: border-box;
        }

        /* Feature-006B-3：主要導覽按鈕微互動 */
        .zdos-nav-btn {
            transition: transform 150ms ease, filter 150ms ease;
        }

        .zdos-nav-btn:active {
            transform: scale(0.97);
        }

        @media (hover: hover) {
            .zdos-nav-btn:hover {
                filter: brightness(1.08);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .zdos-nav-btn {
                transition: filter 100ms ease;
            }

            .zdos-nav-btn:active {
                transform: none;
                filter: brightness(1.06);
            }
        }

        .zdos-app-header--home {
            border-radius: 20px;
            padding: 0.5rem 0.75rem;
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow:
                0 6px 24px rgba(0, 0, 0, 0.28),
                0 1px 0 rgba(255, 255, 255, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .zdos-home-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
            height: 1.625rem;
            max-width: 100%;
            padding: 0 0.5rem;
            border-radius: 9999px;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.5);
            color: rgb(226 232 240);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .zdos-home-badge-row {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 0.375rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .zdos-home-badge-row::-webkit-scrollbar {
            display: none;
        }

        .zdos-home-badge--date {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.45);
            border-color: rgba(255, 255, 255, 0.05);
            background: rgba(15, 23, 42, 0.32);
        }

        .zdos-home-card {
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(15, 23, 42, 0.52);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.2);
        }

        .zdos-dashboard--home-polish {
            --zdos-home-stack: 16px;
            --zdos-home-card-pad: 18px;
            display: flex;
            flex-direction: column;
            gap: var(--zdos-home-stack);
        }

        .zdos-dashboard--home-polish .zdos-home-card--pad {
            padding: var(--zdos-home-card-pad);
        }

        .zdos-dashboard--home-polish .zdos-view-body {
            display: flex;
            flex-direction: column;
            gap: var(--zdos-home-stack);
            min-width: 0;
        }

        .zdos-dashboard-info-zone {
            display: flex;
            flex-direction: column;
            gap: calc(var(--zdos-home-stack) - 2px);
            min-width: 0;
        }

        .zdos-home-ops-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.5rem;
        }

        .zdos-home-ops-card {
            padding: 0.65rem 0.75rem !important;
            min-height: 5.5rem;
        }

        .zdos-home-ops-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.35rem;
        }

        .zdos-home-ops-icon {
            font-size: 1.125rem;
            line-height: 1;
        }

        .zdos-home-ops-arrow {
            font-size: 0.875rem;
            line-height: 1;
            opacity: 0.85;
        }

        .zdos-home-ops-title {
            margin-top: 0.375rem;
            font-size: 0.8125rem;
            font-weight: 700;
            line-height: 1.25;
            color: rgb(248 250 252);
        }

        .zdos-home-ops-desc {
            margin-top: 0.125rem;
            font-size: 0.625rem;
            line-height: 1.35;
            color: rgb(148 163 184);
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
        }

        .zdos-home-ops-badge {
            padding: 0.125rem 0.375rem;
            border-radius: 9999px;
            font-size: 0.5625rem;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
        }

        .zdos-home-version-strip {
            margin-top: 0.5rem;
            padding: 0.625rem 0.75rem !important;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.375rem 0.625rem;
        }

        .zdos-home-version-strip-title {
            font-size: 0.6875rem;
            font-weight: 700;
            color: rgb(153 246 228);
        }

        .zdos-home-version-strip-meta {
            font-size: 0.625rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: rgb(148 163 184);
        }

        @media (max-width: 639px) {
            .zdos-home-ops-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .zdos-home-ops-card {
                min-height: 5rem;
            }
        }

        @media (min-width: 1024px) {
            .zdos-home-ops-grid {
                gap: 0.625rem;
            }

            .zdos-home-ops-card {
                min-height: 5.75rem;
            }
        }

        .zdos-scheduling-shell {
            display: grid;
            grid-template-columns: minmax(0, 240px) minmax(0, 1fr);
            gap: 0.75rem;
            align-items: start;
        }

        .zdos-scheduling-panel {
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(15, 23, 42, 0.52);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .zdos-scheduling-emp-list {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
            max-height: 28rem;
            overflow-y: auto;
        }

        .zdos-scheduling-emp-item {
            width: 100%;
            text-align: left;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(15, 23, 42, 0.45);
            padding: 0.625rem 0.75rem;
            transition: border-color 150ms ease, background 150ms ease;
        }

        .zdos-scheduling-emp-item--support {
            border-color: rgba(245, 158, 11, 0.25);
        }
        .zdos-scheduling-support-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.375rem;
            border-radius: 0.375rem;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: rgb(252, 211, 77);
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .zdos-scheduling-emp-item--active {
            border-color: rgba(129, 140, 248, 0.45);
            background: rgba(99, 102, 241, 0.14);
        }

        .zdos-scheduling-calendar-head {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 0.25rem;
        }

        .zdos-scheduling-calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 0.25rem;
        }

        .zdos-scheduling-weekday {
            text-align: center;
            font-size: 0.625rem;
            font-weight: 700;
            color: rgb(148 163 184);
            padding: 0.375rem 0;
        }

        .zdos-scheduling-day {
            min-height: 3.25rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(15, 23, 42, 0.35);
            padding: 0.375rem;
            font-size: 0.6875rem;
            color: rgb(226 232 240);
        }

        .zdos-scheduling-day--muted {
            opacity: 0.35;
        }

        .zdos-scheduling-day--today {
            border-color: rgba(129, 140, 248, 0.45);
            background: rgba(99, 102, 241, 0.12);
        }

        .zdos-scheduling-day--has-shift {
            border-color: rgba(255, 255, 255, 0.08);
        }

        .zdos-scheduling-day-btn {
            width: 100%;
            min-height: 3.25rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.25rem;
            text-align: left;
            cursor: pointer;
            border: none;
            background: transparent;
            padding: 0;
            color: inherit;
            font: inherit;
        }

        .zdos-scheduling-shift-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.125rem;
            max-width: 100%;
            padding: 0.125rem 0.375rem;
            border-radius: 0.375rem;
            font-size: 9px;
            font-weight: 700;
            line-height: 1.2;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.65);
            color: rgb(226 232 240);
            cursor: pointer;
        }

        .zdos-scheduling-shift-chip--M {
            border-color: rgba(251, 191, 36, 0.35);
            background: rgba(245, 158, 11, 0.14);
            color: rgb(253 230 138);
        }

        .zdos-scheduling-shift-chip--A {
            border-color: rgba(56, 189, 248, 0.35);
            background: rgba(14, 165, 233, 0.14);
            color: rgb(186 230 253);
        }

        .zdos-scheduling-shift-chip--N {
            border-color: rgba(129, 140, 248, 0.35);
            background: rgba(99, 102, 241, 0.14);
            color: rgb(199 210 254);
        }

        .zdos-schedule-modal-panel {
            width: 100%;
            max-width: 24rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .zdos-scheduling-month-nav {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.625rem;
            min-width: 0;
        }

        .zdos-scheduling-store-switch {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .zdos-scheduling-store-btn {
            padding: 0.4375rem 0.875rem;
            border-radius: 0.625rem;
            font-size: 0.6875rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.45);
            color: rgb(148 163 184);
            transition: border-color 150ms ease, background 150ms ease, color 150ms ease;
        }

        .zdos-scheduling-store-btn--active {
            border-color: rgba(129, 140, 248, 0.45);
            background: rgba(99, 102, 241, 0.16);
            color: rgb(199 210 254);
        }

        .zdos-scheduling-emp-item--inactive {
            opacity: 0.72;
            border-color: rgba(251, 191, 36, 0.22);
            cursor: not-allowed;
        }

        .zdos-scheduling-inactive-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.375rem;
            border-radius: 0.375rem;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgb(253 230 138);
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .zdos-scheduling-month-btn {
            width: 1.75rem;
            height: 1.75rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(30, 41, 59, 0.65);
            font-size: 0.875rem;
            font-weight: 800;
            line-height: 1;
            color: rgb(199 210 254);
        }

        .zdos-scheduling-month-label {
            font-size: 0.9375rem;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }

        .zdos-workspace-title--scheduling {
            display: flex;
            justify-content: center;
        }

        @media (max-width: 767px) {
            .zdos-scheduling-shell {
                grid-template-columns: 1fr;
            }

            .zdos-scheduling-emp-list {
                max-height: 12rem;
            }

            .zdos-scheduling-day {
                min-height: 2.5rem;
            }
        }

        .zdos-home-focus-divider {
            margin-top: 0.625rem;
            padding-top: 0.625rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .zdos-home-focus-caption {
            font-size: 10px;
            line-height: 1.45;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.55);
        }

        .zdos-home-progress-bar {
            height: 0.625rem;
            border-radius: 9999px;
            background: rgba(15, 23, 42, 0.85);
            overflow: hidden;
        }

        .zdos-home-progress-bar-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 200ms ease;
        }

        .zdos-glass-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            padding: 0.45rem 0.7rem;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: rgb(226 232 240);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: border-color 150ms ease, transform 150ms ease;
        }

        .zdos-dept-chips {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 0.375rem;
        }

        .zdos-glass-chip--dept {
            width: 100%;
            height: 2.125rem;
            padding: 0 0.35rem;
            font-size: 10px;
            letter-spacing: 0.02em;
            gap: 0.2rem;
            line-height: 1;
        }

        .zdos-glass-chip--dept .zdos-dept-chip-icon {
            font-size: 0.8rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
        }

        @media (hover: hover) {
            .zdos-glass-chip--dept:hover {
                border-color: rgba(255, 255, 255, 0.22);
            }
        }

        @media (hover: none) {
            .zdos-glass-chip--dept:active {
                transform: scale(0.96);
            }
        }

        .zdos-ann-shell {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .zdos-ann-card {
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(15, 23, 42, 0.52);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: border-color 150ms ease, transform 150ms ease, filter 150ms ease;
        }

        .zdos-ann-card--interactive {
            cursor: pointer;
            text-align: left;
            width: 100%;
        }

        @media (hover: hover) {
            .zdos-ann-card--interactive:hover {
                border-color: rgba(255, 255, 255, 0.16);
                filter: brightness(1.06);
            }
        }

        @media (hover: none) {
            .zdos-ann-card--interactive:active {
                transform: scale(0.985);
            }
        }

        .zdos-ann-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 2px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .zdos-ann-scroll::-webkit-scrollbar {
            display: none;
        }

        .zdos-ann-scroll-item {
            flex: 0 0 min(78vw, 260px);
            scroll-snap-align: start;
        }

        .zdos-ann-unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background: rgb(56 189 248);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.45);
            flex-shrink: 0;
        }

        .zdos-beta-banner {
            border-radius: 16px;
            border: 1px solid rgba(251, 191, 36, 0.45);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(239, 68, 68, 0.14));
            box-shadow: 0 8px 28px rgba(245, 158, 11, 0.12);
            padding: 0.75rem 0.875rem;
            text-align: center;
        }

        .zdos-beta-banner-title {
            font-size: 0.8125rem;
            font-weight: 900;
            letter-spacing: 0.14em;
            color: rgb(254 243 199);
        }

        .zdos-beta-banner-desc {
            margin-top: 0.25rem;
            font-size: 0.6875rem;
            line-height: 1.45;
            font-weight: 600;
            color: rgb(253 230 138);
        }

        /* Architecture-001：Function Page 工作空間（與 Dashboard 元件分離） */
        .zdos-workspace {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .zdos-workspace-header {
            border-radius: 16px;
            padding: 0.75rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .zdos-workspace-header-inner {
            display: grid;
            grid-template-columns: minmax(4.5rem, auto) 1fr minmax(4.5rem, auto);
            align-items: center;
            gap: 0.5rem;
        }

        .zdos-workspace-back {
            justify-self: start;
            padding: 0.375rem 0.625rem;
            border-radius: 10px;
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 11px;
            font-weight: 700;
            color: rgb(226 232 240);
        }

        .zdos-workspace-title {
            min-width: 0;
            text-align: center;
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.25;
        }

        .zdos-workspace-actions {
            justify-self: end;
            display: flex;
            align-items: center;

    <script>
        // ========================================================================
        // 1. 全局常數與圖標庫
        // ========================================================================
        const THEMES = {
            'classic-blue': { glow1: 'bg-blue-600', glow2: 'bg-indigo-700', text: 'text-sky-400', border: 'border-sky-500/20', bg: 'bg-sky-500/5' }
        };

        const ROLE_OPTIONS = ['資深員工', '實習幹部', '副領班', '領班', '店經理', '區經理', '人資', '總務', '秘書', '店長', '集團首腦'];

        // ========================================================================
        // Shift Registry（Architecture Rule #003）— 班別分類 ≠ 實際工時
        // timeRange 僅供排班分類、報表、AI 分析、班次篩選；實際上下班由 Schedule / Shift Template 決定
        // ========================================================================
        const SHIFT_REGISTRY = [
            {
                code: 'M',
                name: '早班',
                sortOrder: 1,
                timeRange: { start: '10:00', end: '14:59', wrapsDay: false },
                ui: { icon: '☀️' }
            },
            {
                code: 'A',
                name: '中班',
                sortOrder: 2,
                timeRange: { start: '15:00', end: '21:59', wrapsDay: false },
                ui: { icon: '⛅' }
            },
            {
                code: 'N',
                name: '晚班',
                sortOrder: 3,
                timeRange: { start: '22:00', end: '09:59', wrapsDay: true },
                ui: { icon: '🌙' }
            }
        ];

        const parseTimeToMinutes = hm => {
            const parts = String(hm || '').trim().split(':');
            const h = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10) || 0;
            if (Number.isNaN(h)) return null;
            return h * 60 + m;
        };

        const getShiftRegistry = () => SHIFT_REGISTRY;
        const getShiftByCode = code => SHIFT_REGISTRY.find(s => s.code === String(code || '').trim().toUpperCase()) || null;
        const getShiftByName = name => SHIFT_REGISTRY.find(s => s.name === String(name || '').trim()) || null;
        const resolveShift = ref => {
            if (!ref) return null;
            const key = String(ref).trim();
            return getShiftByCode(key) || getShiftByName(key);
        };
        const getDefaultShiftName = () => getShiftByCode('M')?.name || '早班';
        const formatShiftCategoryTimeRange = shift => {
            if (!shift?.timeRange) return '';
            const { start, end, wrapsDay } = shift.timeRange;
            return wrapsDay ? `${start} ~ 翌日 ${end}` : `${start} ~ ${end}`;
        };
        const isTimeInShiftCategoryRange = (minutes, timeRange) => {
            if (minutes == null || !timeRange) return false;
            const start = parseTimeToMinutes(timeRange.start);
            const end = parseTimeToMinutes(timeRange.end);
            if (start == null || end == null) return false;
            if (timeRange.wrapsDay) return minutes >= start || minutes <= end;
            return minutes >= start && minutes <= end;
        };
        const classifyShiftByTime = input => {
            const minutes = typeof input === 'number' ? input : parseTimeToMinutes(input);
            if (minutes == null) return null;
            for (const shift of SHIFT_REGISTRY) {
                if (isTimeInShiftCategoryRange(minutes, shift.timeRange)) return shift.code;
            }
            return null;
        };
        const getStoreShiftCodes = storeRef => {
            const store = resolveStore(storeRef);
            const codes = store?.features?.shiftCodes;
            return Array.isArray(codes) && codes.length ? codes : ['M'];
        };
        const renderShiftSelectOptions = (shiftCodes, selectedName = '') => {
            const selected = resolveShift(selectedName);
            return shiftCodes.map(code => {
                const shift = getShiftByCode(code);
                if (!shift) return '';
                const isSelected = selected ? selected.code === shift.code : selectedName === shift.name;
                return `<option value="${shift.name}" ${isSelected ? 'selected' : ''}>${shift.name}（${shift.code}） ${shift.ui.icon}</option>`;
            }).join('');
        };
        const renderStoreShiftOptions = (storeName, selected) => renderShiftSelectOptions(getStoreShiftCodes(storeName), selected);
        const renderShiftCategoryLegend = () => SHIFT_REGISTRY.map(shift =>
            `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-slate-950/60 border border-white/[0.05] text-[10px] text-slate-400"><span aria-hidden="true">${shift.ui.icon}</span><span class="font-mono text-slate-300">${shift.code}</span><span>${shift.name}</span><span class="text-slate-500">· 分類 ${formatShiftCategoryTimeRange(shift)}</span></span>`
        ).join('');

        // ========================================================================
        // Shift Template（Feature-008F）— 各門市實際上下班時間；班別分類仍由 SHIFT_REGISTRY 負責
        // ========================================================================
        const SHIFT_TEMPLATE = [
            { id: 'CH-M1', storeId: 'CH', shiftCode: 'M', name: '早班', startTime: '10:00', endTime: '19:00', breakMinutes: 60, defaultPosition: null, isDefault: true, status: 'active', sortOrder: 1 },
            { id: 'CH-A1', storeId: 'CH', shiftCode: 'A', name: '中班', startTime: '15:00', endTime: '00:00', breakMinutes: 0, defaultPosition: null, isDefault: true, status: 'active', sortOrder: 2 },
            { id: 'CH-N1', storeId: 'CH', shiftCode: 'N', name: '晚班', startTime: '22:00', endTime: '02:00', breakMinutes: 0, defaultPosition: null, isDefault: true, status: 'active', sortOrder: 3 },
            { id: 'DG-M1', storeId: 'DG', shiftCode: 'M', name: '早班', startTime: '10:00', endTime: '19:00', breakMinutes: 0, defaultPosition: null, isDefault: true, status: 'active', sortOrder: 1 },
            { id: 'DG-N1', storeId: 'DG', shiftCode: 'N', name: '晚班', startTime: '22:00', endTime: '02:00', breakMinutes: 0, defaultPosition: null, isDefault: true, status: 'active', sortOrder: 2 }
        ];

        const sortShiftTemplates = list => [...list].sort((a, b) => a.sortOrder - b.sortOrder);
        const isShiftTemplateOvernight = template => {
            if (!template) return false;
            const start = parseTimeToMinutes(template.startTime);
            const end = parseTimeToMinutes(template.endTime);
            if (start == null || end == null) return false;
            return end <= start;
        };
        const formatShiftTemplateWorkingTime = template => {
            if (!template) return '';
            return isShiftTemplateOvernight(template)
                ? `${template.startTime} ~ 翌日 ${template.endTime}`
                : `${template.startTime} ~ ${template.endTime}`;
        };
        const getShiftTemplates = () => sortShiftTemplates(SHIFT_TEMPLATE.filter(t => t.status === 'active'));
        const getShiftTemplatesByStore = storeId => {
            const code = String(storeId || '').trim().toUpperCase();
            return sortShiftTemplates(SHIFT_TEMPLATE.filter(t => t.storeId === code && t.status === 'active'));
        };
        const getShiftTemplate = id => SHIFT_TEMPLATE.find(t => t.id === String(id || '').trim()) || null;
        const getDefaultShiftTemplate = (storeId, shiftCode) => {
            const store = String(storeId || '').trim().toUpperCase();
            const shift = String(shiftCode || '').trim().toUpperCase();
            const matches = sortShiftTemplates(SHIFT_TEMPLATE.filter(t =>
                t.storeId === store && t.shiftCode === shift && t.status === 'active'
            ));
            return matches.find(t => t.isDefault) || matches[0] || null;
        };

        // ========================================================================
        // Store Registry（Architecture Rule）— 唯一門市來源，禁止各模組寫死店別
        // ========================================================================
        const STORE_REGISTRY = [
            {
                code: 'CH',
                name: '中華店',
                status: 'active',
                configKey: 'zhonghua',
                features: { mobilePay: true, shiftCodes: ['M', 'A', 'N'] },
                ui: {
                    loginBtn: 'border-sky-500/40 bg-gradient-to-b from-sky-500/20 to-sky-600/10 hover:from-sky-500/30 hover:to-sky-600/20 text-sky-200',
                    badge: 'text-sky-300 border-sky-500/25 bg-sky-950/40',
                    reviewCard: 'border-sky-500/20 bg-sky-500/5',
                    reviewText: 'text-sky-400',
                    pendingBadge: 'bg-sky-950/50 border border-sky-500/20 text-[11px] text-sky-300',
                    statDot: 'bg-sky-500',
                    statAmount: 'text-sky-400',
                    configTabActive: 'bg-sky-950 text-sky-400'
                }
            },
            {
                code: 'DG',
                name: '東港店',
                status: 'active',
                configKey: 'donggang',
                features: { mobilePay: false, shiftCodes: ['M', 'N'] },
                ui: {
                    loginBtn: 'border-amber-500/40 bg-gradient-to-b from-amber-500/20 to-amber-600/10 hover:from-amber-500/30 hover:to-amber-600/20 text-amber-200',
                    badge: 'text-amber-300 border-amber-500/25 bg-amber-950/35',
                    reviewCard: 'border-amber-500/20 bg-amber-500/5',
                    reviewText: 'text-amber-400',
                    pendingBadge: 'bg-amber-950/50 border border-amber-500/20 text-[11px] text-amber-300',
                    statDot: 'bg-amber-500',
                    statAmount: 'text-amber-400',
                    configTabActive: 'bg-amber-950 text-amber-400'
                }
            },
            {
                code: 'HJ',
                name: '後勁店',
                status: 'coming_soon',
                comingSoonToast: '後勁店目前尚未開放',
                ui: {
                    loginBtn: 'border-emerald-500/20 bg-slate-900/55 text-slate-400',
                    reservedLabel: '尚未開放'
                }
            }
        ];

        const getStoreRegistry = () => STORE_REGISTRY;
        const getStoreByCode = code => STORE_REGISTRY.find(s => s.code === String(code || '').trim().toUpperCase()) || null;
        const getStoreByName = name => STORE_REGISTRY.find(s => s.name === name) || null;
        const resolveStore = ref => {
            if (!ref) return null;
            const key = String(ref).trim();
            return getStoreByCode(key.toUpperCase()) || getStoreByName(key) || null;
        };
        const normalizeStoreIdCode = ref => resolveStore(ref)?.code || null;
        const getActiveStores = () => STORE_REGISTRY.filter(s => s.status === 'active');
        const getStoresWithConfig = () => getActiveStores().filter(s => s.configKey);
        const getDefaultActiveStoreName = () => getActiveStores()[0]?.name || '';
        const isStoreActive = ref => resolveStore(ref)?.status === 'active';
        const isStoreComingSoon = ref => resolveStore(ref)?.status === 'coming_soon';
        const getComingSoonToast = ref => resolveStore(ref)?.comingSoonToast || `${resolveStore(ref)?.name || '此門市'}目前尚未開放`;
        const storeHasMobilePay = name => !!resolveStore(name)?.features?.mobilePay;
        const getStoreGoogleConfigKey = name => resolveStore(name)?.configKey || null;
        const getStoreGoogleConfig = name => {
            const key = getStoreGoogleConfigKey(name);
            return key ? state.googleFormSettings[key] : null;
        };
        const getStoreBadgeTone = name => resolveStore(name)?.ui?.badge || 'text-slate-300 border-white/[0.08] bg-slate-900/40';
        const getStoreReviewCardClass = name => resolveStore(name)?.ui?.reviewCard || 'border-white/[0.04] bg-slate-900/20';
        const getStoreReviewTextClass = name => resolveStore(name)?.ui?.reviewText || 'text-slate-300';
        const buildPendingCountByStore = records => {
            const counts = {};
            getActiveStores().forEach(s => { counts[s.name] = records.filter(r => r.store === s.name).length; });
            return counts;
        };
        const countPendingTotal = counts => Object.values(counts).reduce((sum, n) => sum + n, 0);
        const renderPendingCountSummary = counts => getActiveStores().map(s => `${s.name.replace('店', '')} ${counts[s.name] || 0}`).join(' · ');
        const renderPendingStoreBadges = counts => getActiveStores().map(s =>
            `<span class="inline-flex items-center px-2.5 py-1 rounded-lg ${s.ui.pendingBadge}">${s.name}：${counts[s.name] || 0} 筆</span>`
        ).join('');
        const renderActiveStoreStatsCards = salesRecords => getActiveStores().map(s => {
            const storeRecords = salesRecords.filter(r => r.store === s.name);
            const amount = storeRecords.reduce((acc, cur) => acc + safeFloat(cur.salesAmount), 0);
            return `<div class="p-6 bg-slate-900/40 border border-white/[0.04] rounded-2xl flex flex-col justify-between shadow-md">
                <div><div class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded-full ${s.ui.statDot}"></span><p class="text-xs text-slate-400 tracking-wider font-sans">${s.name}當月累計業績</p></div><h3 class="text-2xl font-extrabold ${s.ui.statAmount} mt-1 font-mono">$${amount.toLocaleString()}</h3></div>
                <div class="mt-4 pt-4 border-t border-white/[0.04] flex items-center justify-between text-[11px] text-slate-400 font-sans"><span>已錄入項目總筆數</span><span class="font-mono">${storeRecords.length} 班次</span></div>
            </div>`;
        }).join('');
        const renderStoreConfigTabButtons = activeTab => getStoresWithConfig().map(s =>
            `<button type="button" onclick="changeConfigTabDirect('${s.configKey}')" class="flex-1 py-1.5 text-[10px] font-bold rounded-lg ${activeTab === s.configKey ? s.ui.configTabActive : 'text-slate-400'}">🏬 ${s.name}</button>`
        ).join('');
        const renderComingSoonStoreConfigNotice = () => STORE_REGISTRY.filter(s => s.status === 'coming_soon').map(s =>
            `<p class="text-[10px] text-emerald-400/80">${s.name}（${s.code}）尚未開放，暫無雲端對接設定。</p>`
        ).join('');
        const renderStoreSelectOptions = (selected = '', includeNone = false) => {
            let html = '';
            if (includeNone) html += `<option value="無" ${selected === '無' ? 'selected' : ''}>無</option>`;
            STORE_REGISTRY.forEach(store => {
                if (store.status === 'active') {

            for (let i = 0; i < firstWeekday; i += 1) cells.push({ day: '', muted: true, today: false });
            const now = new Date();
            const isCurrentMonth = now.getFullYear() === year && (now.getMonth() + 1) === month;
            const todayDay = isCurrentMonth ? now.getDate() : null;
            for (let day = 1; day <= daysInMonth; day += 1) {
                cells.push({
                    day,
                    muted: false,
                    today: todayDay === day,
                    dateStr: `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`

            while (cells.length % 7 !== 0) cells.push({ day: '', muted: true, today: false });

        window.exportFullBackup = function() {
            try {
                saveState();
                const payload = { app: 'DAPU OS', version: '1.0.0 Recovery', exportedAt: new Date().toISOString(), localStorage: {} };
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    payload.localStorage[key] = localStorage.getItem(key);
                }
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const now = new Date();
                const pad = n => String(n).padStart(2, '0');
                a.href = url;
                a.download = `DAPU_Backup_${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                showToast('完整備份已下載，請妥善保存。', 'success');
            } catch (err) {
                console.error(err);
                showToast('備份失敗，請重新嘗試。', 'error');
            }
        };

        window.restoreFullBackup = function(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            if (!confirm('還原會覆蓋目前這台裝置上的帳號、業績、庫存與設定。確定繼續嗎？')) {
                event.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function() {
                try {
                    const payload = JSON.parse(reader.result);
                    if (!payload || !payload.localStorage || typeof payload.localStorage !== 'object') throw new Error('Invalid backup');
                    localStorage.clear();
                    Object.entries(payload.localStorage).forEach(([key, value]) => {
                        if (value !== null && value !== undefined) localStorage.setItem(key, String(value));
                    });
                    alert('還原完成，系統將重新載入。');
                    location.reload();
                } catch (err) {
                    console.error(err);
                    showToast('備份檔格式錯誤，無法還原。', 'error');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file, 'utf-8');
        };
