            const before = getSchedules().length;
            state.schedules = getSchedules().filter(s => s.id !== id);
            if (state.schedules.length === before) return { ok: false, message: '找不到排班紀錄。' };
            saveSchedules();
            return { ok: true };
        };

        const getLeaveRegistry = () => (Array.isArray(state.leaveRegistry) ? state.leaveRegistry : []);

        const LEAVE_TYPE_VACATION = '休假';
        const LEAVE_TYPE_VACATION_GENERAL = '休假（一般）';
        const LEAVE_TYPE_VACATION_CHOICE = '休假（自選）';
        const LEAVE_TYPE_SPECIAL_ANNUAL_LABEL = '特休（未開放）';
        const LEAVE_TYPE_SPECIAL_ANNUAL_FORM_VALUE = '__ZDOS_LEAVE_SPECIAL_ANNUAL_DISABLED__';

        const LEAVE_TYPE_DEFINITIONS = [
            {
                id: 'vacation',
                cssKey: 'vacation',
                label: LEAVE_TYPE_VACATION,
                storageValues: [LEAVE_TYPE_VACATION, LEAVE_TYPE_VACATION_GENERAL, '休'],
                enabled: true,
                formOrder: 1,
                compactLabel: '休假'
            },
            {
                id: 'vacation_choice',
                cssKey: 'vacation-choice',
                label: LEAVE_TYPE_VACATION_CHOICE,
                storageValues: [LEAVE_TYPE_VACATION_CHOICE],
                enabled: true,
                formOrder: 2,
                compactLabel: '自選休'
            },
            {
                id: 'personal',
                cssKey: 'personal',
                label: '事假',
                storageValues: ['事假', 'PERSONAL', '事'],
                enabled: true,
                formOrder: 3,
                compactLabel: '事假'
            },
            {
                id: 'official',
                cssKey: 'official',
                label: '公假',
                storageValues: ['公假', 'PUBLIC', '公'],
                enabled: true,
                formOrder: 4,
                compactLabel: '公假'
            },
            {
                id: 'sick',
                cssKey: 'sick',
                label: '病假',
                storageValues: ['病假', 'SICK', '病'],
                enabled: true,
                formOrder: 5,
                compactLabel: '病假'
            },
            {
                id: 'special_annual_closed',
                cssKey: 'special-closed',
                label: LEAVE_TYPE_SPECIAL_ANNUAL_LABEL,
                storageValues: [LEAVE_TYPE_SPECIAL_ANNUAL_FORM_VALUE],
                enabled: false,
                formOrder: 6,
                compactLabel: LEAVE_TYPE_SPECIAL_ANNUAL_LABEL,
                formValue: LEAVE_TYPE_SPECIAL_ANNUAL_FORM_VALUE
            }
        ];

        const LEAVE_TYPE_DEFINITION_BY_STORAGE = (() => {
            const map = new Map();
            LEAVE_TYPE_DEFINITIONS.forEach(def => {
                (def.storageValues || []).forEach(v => map.set(String(v).trim(), def));
                if (def.label) map.set(String(def.label).trim(), def);
                if (def.formValue) map.set(String(def.formValue).trim(), def);
            });
            return map;
        })();

        const getLeaveTypeDefinition = leaveType => {
            const t = String(leaveType || '').trim();
            if (!t) return null;
            const direct = LEAVE_TYPE_DEFINITION_BY_STORAGE.get(t);
            if (direct) return direct;
            if (/特休/.test(t) && t !== LEAVE_TYPE_SPECIAL_ANNUAL_LABEL) {
                return LEAVE_TYPE_DEFINITIONS.find(d => d.id === 'annual') || null;
            }
            return null;
        };

        const resolveLeaveTypeCssKey = leaveType => {
            const t = String(leaveType || '').trim();
            if (!t) return 'other';
            const def = getLeaveTypeDefinition(t);
            if (def?.cssKey) return def.cssKey;
            if (t === 'REST' || t === '特休' || t === '特') return 'annual';
            if (/特休/.test(t)) return 'special-closed';
            if (t === '支援' || t === '支援假') return 'support';
            if (t === 'ABSENT' || t === '曠' || t === '曠職') return 'other';
            if (/事假|事/.test(t)) return 'personal';
            if (/病假|病/.test(t)) return 'sick';
            if (/公假|公/.test(t)) return 'official';
            return 'other';
        };

        const getLeaveTypeColorClasses = leaveType => `zdos-leave-type--${resolveLeaveTypeCssKey(leaveType)}`;

        const getLeaveTypeBadgeClasses = leaveType =>
            `zdos-scheduling-leave-chip ${getLeaveTypeColorClasses(leaveType)}`;

        const getLeaveTypeOptionClasses = leaveType => {
            const def = getLeaveTypeDefinition(leaveType);
            const base = getLeaveTypeColorClasses(leaveType);
            return def && def.enabled === false ? `${base} zdos-leave-type-option--disabled` : base;
        };

        const isLeaveTypeStorageAllowed = leaveType => {
            const t = String(leaveType || '').trim();
            if (!t) return false;
            if (t === LEAVE_TYPE_SPECIAL_ANNUAL_FORM_VALUE) return false;
            const def = getLeaveTypeDefinition(t);
            if (def && def.enabled === false) return false;
            if (t === LEAVE_TYPE_SPECIAL_ANNUAL_LABEL) return false;
            return true;
        };

        const isVacationGeneralLeaveType = leaveType => {
            const t = String(leaveType || '').trim();
            return t === LEAVE_TYPE_VACATION || t === LEAVE_TYPE_VACATION_GENERAL;
        };

        const getLeaveFormTypeDefinitions = () =>
            [...LEAVE_TYPE_DEFINITIONS].sort((a, b) => (a.formOrder || 99) - (b.formOrder || 99));

        const renderLeaveFormTypeOptionsHtml = (selectedValue, employeeId, storeId, existingLeave) => {
            return getLeaveFormTypeDefinitions().map(def => {
                const value = def.enabled === false
                    ? (def.formValue || LEAVE_TYPE_SPECIAL_ANNUAL_FORM_VALUE)
                    : (def.storageValues?.[0] || def.label);
                const selected = String(selectedValue || '').trim() === String(value).trim()
                    || (def.id === 'vacation' && isVacationGeneralLeaveType(selectedValue))
                    ? ' selected'
                    : '';
                const blocked = def.id === 'vacation_choice' && isLeaveTypeVacationChoiceBlocked(
                    employeeId, storeId, def.label, existingLeave
                );
                const disabled = def.enabled === false || blocked;
                const suffix = def.enabled === false ? '' : (blocked ? '（未開放）' : '');
                const optionClass = getLeaveTypeOptionClasses(value);
                return `<option value="${escapeHtmlText(value)}" class="${escapeHtmlText(optionClass)}"${selected}${disabled ? ' disabled' : ''}>${escapeHtmlText(def.label + suffix)}</option>`;
            }).join('');
        };

        const saveLeaveRegistry = () => {
            // Feature-010：Supabase leave_requests 為唯一 SoT。
            // 不再寫入 localStorage（含 cache），避免被當成正式資料來源。
            state.leaveRegistry = getLeaveRegistry();
        };

        const isLeaveCloudReady = () =>
            !!(isSalesCloudEnabled() && state.supabaseSessionReady && state.authUser && getSupabaseClient());

        const mapCloudLeaveRowToRegistry = row => {
            const empNo = String(row?.employee_no || '').trim();
            const emp = getEmployee(empNo);
            const storeCode = state.supabaseStoreUuidByUuid?.[row?.store_id]
                || normalizeStoreIdCode(row?.store_id)
                || '';
            return {
                id: String(row?.id || ''),
                employeeId: emp?.id || empNo,
                employeeNo: empNo,
                storeId: storeCode,
                date: String(row?.leave_date || '').trim(),
                leaveType: String(row?.leave_type || '').trim(),
                note: String(row?.note || '').trim(),
                createdAt: row?.created_at || null,
                updatedAt: row?.updated_at || null,
                cloudStoreId: row?.store_id || null,
                cloudEmployeeId: row?.employee_id || null
            };
        };

        const resolveLeaveCloudEmployeeNo = employeeId => {
            const emp = getEmployee(employeeId);
            return String(emp?.employeeNo || employeeId || '').trim();
        };

        const resolveLeaveCloudProfileId = async employeeNo => {
            const client = getSupabaseClient();
            const { data, error } = await client.rpc('resolve_profile_id_by_employee_no', {
                p_employee_no: employeeNo
            });
            if (error) throw error;
            return data || null;
        };

        const teardownLeaveRequestsRealtime = async () => {
            const ch = state.leaveRequestsRealtimeChannel;
            if (!ch) return;
            try {
                const client = getSupabaseClient();
                if (client) await client.removeChannel(ch);
            } catch (_) { /* ignore */ }
            state.leaveRequestsRealtimeChannel = null;
        };

        const fetchLeaveRequestsForMonth = async (year, month, storeCode) => {
            if (!isLeaveCloudReady()) {
                return { ok: false, message: '請假需雲端登入後才能載入。' };
            }
            state.leaveCloudLoading = true;
            state.leaveCloudError = '';
            try {
                await ensureSupabaseStoreUuidMap();
                const code = normalizeStoreIdCode(storeCode);
                const storeUuid = state.supabaseStoreUuidByCode?.[code];
                if (!storeUuid) {
                    return { ok: false, message: '找不到門市對應的雲端資料。' };
                }
                const y = Number(year);
                const m = Number(month);
                const start = `${y}-${String(m).padStart(2, '0')}-01`;
                const endDay = new Date(y, m, 0).getDate();
                const end = `${y}-${String(m).padStart(2, '0')}-${String(endDay).padStart(2, '0')}`;
                const { data, error } = await getSupabaseClient()
                    .from('leave_requests')
                    .select('*')
                    .eq('store_id', storeUuid)
                    .gte('leave_date', start)
                    .lte('leave_date', end)
                    .order('leave_date', { ascending: true });
                if (error) throw error;
                const mapped = (data || []).map(mapCloudLeaveRowToRegistry);
                // 以本月＋本店雲端結果覆寫記憶體（SoT）；不混入 localStorage。
                const prefix = `${y}-${String(m).padStart(2, '0')}-`;
                const others = getLeaveRegistry().filter(row => {
                    const sameStore = normalizeStoreIdCode(row.storeId) === code;
                    const sameMonth = String(row.date || '').startsWith(prefix);
                    return !(sameStore && sameMonth);
                });
                const byId = new Map();
                others.concat(mapped).forEach(row => {
                    if (row?.id) byId.set(row.id, row);
                });
                state.leaveRegistry = [...byId.values()];
                saveLeaveRegistry();
                return { ok: true, rows: mapped };
            } catch (err) {
                console.error('[ZDOS leave] fetch leave_requests failed', err);
                state.leaveCloudError = err?.message || '載入雲端請假失敗。';
                return { ok: false, message: state.leaveCloudError };
            } finally {
                state.leaveCloudLoading = false;
            }
        };

        const fetchLeaveRequestsForCurrentView = async () => {
            const storeCode = getSchedulingViewStoreId() || getSchedulingStoreId();
            const year = state.schedule?.year;
            const month = state.schedule?.month;
            if (!storeCode || !year || !month) {
                return { ok: false, message: '無法判斷目前門市或月份。' };
            }
            return fetchLeaveRequestsForMonth(year, month, storeCode);
        };

        const subscribeLeaveRequestsRealtime = () => {
            if (!isLeaveCloudReady()) return;
            if (state.leaveRequestsRealtimeChannel) return;
            const client = getSupabaseClient();
            const channel = client
                .channel('zdos-leave-requests-live')
                .on(
                    'postgres_changes',
                    { event: '*', schema: 'public', table: 'leave_requests' },
                    () => {
                        if (state.currentView !== 'scheduling' && state.currentView !== 'leaveCenter' && state.currentView !== 'hrHome') return;
                        void fetchLeaveRequestsForCurrentView().then(res => {
                            if (!res.ok) return;
                            // 編輯／排班 Modal 開啟時勿整頁重繪，避免手機 Modal 消失或卡住
                            if (state.leaveModal || state.schedulingModal) return;
                            renderApp();
                        });
                    }
                )
                .subscribe();
            state.leaveRequestsRealtimeChannel = channel;
        };

        const getLeaveSelectionWindowRegistry = () => (
            Array.isArray(state.leaveSelectionWindowRegistry) ? state.leaveSelectionWindowRegistry : []
        );

        const saveLeaveSelectionWindowRegistry = () => {
            state.leaveSelectionWindowRegistry = getLeaveSelectionWindowRegistry();
            safeSetItem(LEAVE_SELECTION_WINDOW_KEY, JSON.stringify(state.leaveSelectionWindowRegistry));
        };

        const normalizeLeaveSelectionMode = mode => {
            const m = String(mode || '').trim().toLowerCase();
            if (m === 'open' || m === 'forced_open') return 'open';
            if (m === 'closed' || m === 'forced_closed') return 'closed';
            return 'auto';
        };

        const formatDatetimeLocalInputValue = value => {
            const raw = String(value || '').trim();
            if (!raw) return '';
            const d = new Date(raw);
            if (Number.isNaN(d.getTime())) return '';
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };

        const parseDatetimeLocalInputValue = value => {
            const raw = String(value || '').trim();
            if (!raw) return '';
            const d = new Date(raw);
            if (Number.isNaN(d.getTime())) return '';
            return d.toISOString();
        };

        const getLeaveSelectionWindowForStore = storeId => {
            const code = normalizeStoreIdCode(storeId);
            if (!code) return null;
            const list = getLeaveSelectionWindowRegistry();
            return list.find(row => normalizeStoreIdCode(row.storeId) === code) || null;
        };

        const evaluateLeaveSelectionWindow = (config, now = new Date()) => {
            if (!config || config.enabled === false) {
                return { open: false, phase: 'disabled', message: '預選休假（自選）尚未開放。' };
            }
            const mode = normalizeLeaveSelectionMode(config.mode);
            if (mode === 'open') {
                return { open: true, phase: 'forced_open', message: '強制開放中' };
            }
            if (mode === 'closed') {
                return { open: false, phase: 'forced_closed', message: '目前已關閉預選休假（自選）。' };
            }
            const startMs = config.startAt ? new Date(config.startAt).getTime() : NaN;
            const endMs = config.endAt ? new Date(config.endAt).getTime() : NaN;
            const t = now.getTime();
            if (!Number.isFinite(startMs) || !Number.isFinite(endMs)) {
                return { open: false, phase: 'not_configured', message: '預選休假（自選）尚未開放。' };
            }
            if (t < startMs) {
                return { open: false, phase: 'not_started', message: '預選休假尚未開始。' };
            }
            if (t > endMs) {
                return { open: false, phase: 'ended', message: '預選休假已截止。' };
            }
            return { open: true, phase: 'auto_open', message: '開放中（自動時段）' };
        };

        const canManageLeaveSelectionWindowForStore = storeId =>
            canCurrentUserManageLeaveSelectionWindow(storeId);

        const isLeaveSelectionWindowManagerForStore = (storeId, user = getLoggedInAccount()) =>
            canUserManageLeaveSelectionWindow(user, storeId);

        const assertLeaveSelectionWindowMutation = ({
            storeId,
            employeeId,
            leaveType,
            existingLeave = null,
            user = getLoggedInAccount()
        }) => {
            const storeCode = normalizeStoreIdCode(storeId);
            if (!storeCode) return { ok: true };
            if (isLeaveSelectionWindowManagerForStore(storeCode, user)) return { ok: true };
            const emp = getEmployee(employeeId);
            if (!isFullTimeEmployee(emp)) return { ok: true };
            const nextType = String(leaveType || '').trim();
            const prevType = existingLeave ? String(existingLeave.leaveType || '').trim() : '';
            const touchesChoice = nextType === LEAVE_TYPE_VACATION_CHOICE
                || prevType === LEAVE_TYPE_VACATION_CHOICE;
            if (!touchesChoice) return { ok: true };
            const config = getLeaveSelectionWindowForStore(storeCode);
            const status = evaluateLeaveSelectionWindow(config);
            if (status.open) return { ok: true };
            return { ok: false, message: status.message || '目前無法操作休假（自選）。' };
        };

        const assertLeaveSelectionWindowDelete = (leave, user = getLoggedInAccount()) => {
            if (!leave) return { ok: true };
            const storeCode = normalizeStoreIdCode(leave.storeId);
            if (!storeCode) return { ok: true };
            if (isLeaveSelectionWindowManagerForStore(storeCode, user)) return { ok: true };
            // 員工本人可取消自己的休假（含自選；取消≠新提交）
            const self = getCurrentUserPersonnel();
            const leaveEmpId = normalizeLeaveEmployeeId(leave.employeeId);
            if (self && normalizeLeaveEmployeeId(self.id) === leaveEmpId) return { ok: true };
            if (String(leave.leaveType || '').trim() !== LEAVE_TYPE_VACATION_CHOICE) return { ok: true };
            const emp = getEmployee(leave.employeeId);
            if (!isFullTimeEmployee(emp)) return { ok: true };
            const config = getLeaveSelectionWindowForStore(storeCode);
            const status = evaluateLeaveSelectionWindow(config);
            if (status.open) return { ok: true };
            return { ok: false, message: status.message || '目前無法刪除休假（自選）。' };
        };

        const canCurrentUserCancelLeave = leave => {
            if (!leave) return false;
            return assertLeaveSelectionWindowDelete(leave).ok;
        };

        const upsertLeaveSelectionWindowConfig = (storeId, data) => {
            const code = normalizeStoreIdCode(storeId);
            if (!code) return { ok: false, message: '門市無效。' };
            if (!canUserManageLeaveSelectionWindow(getLoggedInAccount(), code)) {
                return { ok: false, message: '無權管理此門市預選休假開放設定。' };
            }
            const mode = normalizeLeaveSelectionMode(data?.mode);
            const startAt = parseDatetimeLocalInputValue(data?.startAt);
            const endAt = parseDatetimeLocalInputValue(data?.endAt);
            if (mode === 'auto' && startAt && endAt && new Date(startAt) > new Date(endAt)) {
                return { ok: false, message: '截止時間必須晚於開始時間。' };
            }
            const now = new Date().toISOString();
            const list = getLeaveSelectionWindowRegistry();
            const idx = list.findIndex(row => normalizeStoreIdCode(row.storeId) === code);
            const record = {
                id: idx >= 0 ? list[idx].id : `lsw-${Date.now()}`,
                storeId: code,
                mode,
                startAt,
                endAt,
                enabled: data?.enabled !== false,
                createdAt: idx >= 0 ? list[idx].createdAt : now,
                updatedAt: now
            };
            if (idx >= 0) list[idx] = record;
            else list.push(record);
            state.leaveSelectionWindowRegistry = list;
            saveLeaveSelectionWindowRegistry();
            return { ok: true, config: record };
        };

        const renderLeaveSelectionWindowAdminPanel = viewStoreId => {
            if (!canManageLeaveSelectionWindowForStore(viewStoreId) || !viewStoreId) return '';
            const config = getLeaveSelectionWindowForStore(viewStoreId) || {
                mode: 'auto',
                startAt: '',
                endAt: '',
                enabled: true
            };
            const status = evaluateLeaveSelectionWindow(config);
            const statusClass = status.open ? 'zdos-leave-selection-status--open' : 'zdos-leave-selection-status--closed';
            const mode = normalizeLeaveSelectionMode(config.mode);
            const startVal = formatDatetimeLocalInputValue(config.startAt);
            const endVal = formatDatetimeLocalInputValue(config.endAt);
            const storeLabel = getStoreByCode(viewStoreId)?.name || viewStoreId;
            return `
                <section class="zdos-leave-selection-admin" aria-labelledby="leave-selection-admin-title">
                    <h3 id="leave-selection-admin-title" class="zdos-leave-selection-admin-title">員工預選休假開放管理 · ${escapeHtmlText(storeLabel)}</h3>
                    <p class="mt-1 text-[10px] text-slate-500">僅限制正職員工自行提交「${escapeHtmlText(LEAVE_TYPE_VACATION_CHOICE)}」；主管代填不受限。</p>
                    <p class="mt-1 text-[10px] ${statusClass} zdos-leave-selection-status">目前狀態：${escapeHtmlText(status.message)}</p>
                    <form onsubmit="submitLeaveSelectionWindowForm(event)" class="mt-2 space-y-2">
                        <input type="hidden" name="storeId" value="${escapeHtmlText(viewStoreId)}">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 mb-1" for="lsw-mode">模式</label>
                                <select id="lsw-mode" name="mode" class="w-full rounded-lg bg-slate-950/70 border border-white/[0.08] px-2 py-1.5 text-xs text-slate-100">
                                    <option value="auto"${mode === 'auto' ? ' selected' : ''}>自動（依開始／截止時間）</option>
                                    <option value="open"${mode === 'open' ? ' selected' : ''}>強制開放</option>
                                    <option value="closed"${mode === 'closed' ? ' selected' : ''}>強制關閉</option>
                                </select>
                            </div>
                            <div class="flex items-end">
                                <label class="inline-flex items-center gap-2 text-[10px] text-slate-300 pb-1.5">
                                    <input type="checkbox" name="enabled" value="1"${config.enabled !== false ? ' checked' : ''} class="rounded border-white/20">
                                    啟用設定
                                </label>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 mb-1" for="lsw-start">開始時間</label>
                                <input id="lsw-start" name="startAt" type="datetime-local" value="${escapeHtmlText(startVal)}" class="w-full rounded-lg bg-slate-950/70 border border-white/[0.08] px-2 py-1.5 text-xs text-slate-100">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 mb-1" for="lsw-end">截止時間</label>
                                <input id="lsw-end" name="endAt" type="datetime-local" value="${escapeHtmlText(endVal)}" class="w-full rounded-lg bg-slate-950/70 border border-white/[0.08] px-2 py-1.5 text-xs text-slate-100">
                            </div>
                        </div>
                        <button type="submit" class="zdos-nav-btn px-3 py-1.5 rounded-lg border border-indigo-500/35 bg-indigo-600/15 text-indigo-200 text-[11px] font-bold">儲存本店設定</button>
                    </form>
                </section>`;
        };

        window.submitLeaveSelectionWindowForm = function(event) {
            event.preventDefault();
            const form = event.target;
            const storeId = form.querySelector('[name="storeId"]')?.value;
            if (!canUserManageLeaveSelectionWindow(getLoggedInAccount(), storeId)) {
                return showToast('無權管理此門市預選休假開放設定。', 'error');
            }
            const mode = form.querySelector('[name="mode"]')?.value;
            const startAt = form.querySelector('[name="startAt"]')?.value;
            const endAt = form.querySelector('[name="endAt"]')?.value;
            const enabled = !!form.querySelector('[name="enabled"]')?.checked;
            const result = upsertLeaveSelectionWindowConfig(storeId, { mode, startAt, endAt, enabled });
            if (!result.ok) return showToast(result.message, 'error');
            showToast('預選休假開放設定已儲存。', 'success');
            renderApp();
        };

        const getLeaveSelectionWindowHintForForm = (employeeId, storeId) => {
            if (canManageLeaveSelectionWindowForStore(storeId)) return '';
            const emp = getEmployee(employeeId);
            if (!isFullTimeEmployee(emp)) return '';
            const config = getLeaveSelectionWindowForStore(storeId);
            const status = evaluateLeaveSelectionWindow(config);
            if (status.open) {
                return `<p class="text-[10px] text-emerald-300/90">${escapeHtmlText(status.message)} · 可提交「${escapeHtmlText(LEAVE_TYPE_VACATION_CHOICE)}」</p>`;
            }
            return `<p class="text-[10px] text-amber-300/90">${escapeHtmlText(status.message)}</p>`;
        };

        const isLeaveTypeVacationChoiceBlocked = (employeeId, storeId, leaveType, existingLeave) => {
            if (String(leaveType || '').trim() !== LEAVE_TYPE_VACATION_CHOICE
                && String(existingLeave?.leaveType || '').trim() !== LEAVE_TYPE_VACATION_CHOICE) {
                return false;
            }
            const check = assertLeaveSelectionWindowMutation({
                storeId,
                employeeId: employeeId || existingLeave?.employeeId,
                leaveType: leaveType || existingLeave?.leaveType,
                existingLeave
            });
            return !check.ok;
        };

        const normalizeLeaveEmployeeId = employeeId => {
            const key = String(employeeId || '').trim();
            if (!key) return '';
            const emp = getEmployee(key);
            return emp ? emp.id : key;
        };

        const leaveMatchesEmployee = (leave, employeeId) => {
            const normalized = normalizeLeaveEmployeeId(employeeId);
            if (!normalized) return false;
            return String(leave?.employeeId || '').trim() === normalized;
        };

        const getLeavesByMonth = (year, month) => {
            const y = Number(year);
            const m = Number(month);
            if (!Number.isFinite(y) || !Number.isFinite(m) || m < 1 || m > 12) return [];
            const prefix = `${y}-${String(m).padStart(2, '0')}-`;
            return getLeaveRegistry().filter(row => String(row.date || '').startsWith(prefix));
        };

        const getLeavesByDate = date => {
            const day = String(date || '').trim();
            if (!day) return [];
            return getLeaveRegistry().filter(row => String(row.date || '').trim() === day);
        };

        const getEmployeeLeaves = employeeId => {
            if (!String(employeeId || '').trim()) return [];
            return getLeaveRegistry().filter(row => leaveMatchesEmployee(row, employeeId));
        };

        // UI-010G：時段衝突（上午／下午可共存；全天與任何時段衝突）。時段寫在 note 前綴【上午】／【下午】，不新增欄位。
        const getLeavePeriodFromRow = row => {
            const explicit = String(row?.period || '').trim();
            if (explicit === '上午' || explicit === '下午' || explicit === '全天') return explicit;
            if (explicit === 'FIRST_HALF') return '上午';
            if (explicit === 'SECOND_HALF') return '下午';
            const match = String(row?.note || '').match(/^【(上午|下午)】/);
            return match?.[1] || '全天';
        };
        const leavePeriodsConflict = (a, b) => a === '全天' || b === '全天' || a === b;
        const findLeaveConflict = (employeeId, storeId, date, excludeId = null, period = null) => {
            const empKey = normalizeLeaveEmployeeId(employeeId);
            const storeCode = normalizeStoreIdCode(storeId);
            const day = String(date || '').trim();
            const wantPeriod = period || '全天';
            if (!empKey || !storeCode || !day) return null;
            return getLeaveRegistry().find(row => {
                if (excludeId && row.id === excludeId) return false;
                if (!(row.employeeId === empKey
                    && normalizeStoreIdCode(row.storeId) === storeCode
                    && String(row.date || '').trim() === day)) return false;
                return leavePeriodsConflict(getLeavePeriodFromRow(row), wantPeriod);
            }) || null;
        };

        // ========================================================================
        // Leave Import Report（Feature-010D.1）— 唯讀匯總，不寫入 Registry
        // ========================================================================
        const LEAVE_IMPORT_REPORT_STORE_ORDER = ['CH', 'DG'];

        const getLeaveRecordImportSource = row =>
            isBaselineManagedLeaveId(row?.id) ? 'baseline' : 'user';

        const formatLeaveImportDateLabel = isoDate => {
            const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(isoDate || '').trim());
            if (!match) return String(isoDate || '');
            return `${Number(match[2])}/${match[3]}`;
        };

        const normalizeLeaveImportReportRow = row => {
            const emp = getEmployee(row?.employeeId);
            const storeId = normalizeStoreIdCode(row?.storeId) || String(row?.storeId || '').trim();
            const storeName = getStoreByCode(storeId)?.name || storeId;
            const duration = Number(row?.duration ?? 1);
            const period = String(row?.period || '').trim();
            const display = String(row?.display || '').trim()
                || (period === 'FIRST_HALF' ? '上休' : period === 'SECOND_HALF' ? '下休' : '')
                || (row?.leaveType === 'REST' ? '休' : String(row?.leaveType || '').trim());
            return {
                leaveId: String(row?.id || '').trim(),
                storeId,
                storeName,
                employeeId: String(row?.employeeId || '').trim(),
                employeeNo: emp?.employeeNo || '',
                employeeName: emp?.name || '',
                date: String(row?.date || '').trim(),
                dateLabel: formatLeaveImportDateLabel(row?.date),
                leaveType: String(row?.leaveType || '').trim(),
                display,
                duration,
                period,
                source: getLeaveRecordImportSource(row)
            };
        };

        const classifyLeaveImportDurationBucket = row => {
            const period = String(row?.period || '').trim();
            const display = String(row?.display || '').trim();
            if (period === 'FIRST_HALF' || display === '上休') return 'halfAm';
            if (period === 'SECOND_HALF' || display === '下休') return 'halfPm';
            return 'fullDay';
        };

        const buildLeaveImportReportStatistics = rows => {
            const stats = {
                total: rows.length,
                REST: 0,
                PERSONAL: 0,
                SICK: 0,
                PUBLIC: 0,
                ABSENT: 0,
                [LEAVE_TYPE_VACATION_GENERAL]: 0,
                [LEAVE_TYPE_VACATION_CHOICE]: 0,
                fullDay: 0,
                halfAm: 0,
                halfPm: 0,
                baseline: 0,
                user: 0
            };
            rows.forEach(row => {
                const typeKey = String(row.leaveType || '').trim().toUpperCase();
                const typeRaw = String(row.leaveType || '').trim();
                if (Object.prototype.hasOwnProperty.call(stats, typeKey)) stats[typeKey] += 1;
                if (isVacationGeneralLeaveType(typeRaw)) stats[LEAVE_TYPE_VACATION_GENERAL] += 1;
                if (typeRaw === LEAVE_TYPE_VACATION_CHOICE) stats[LEAVE_TYPE_VACATION_CHOICE] += 1;
                const bucket = classifyLeaveImportDurationBucket(row);
                if (bucket === 'halfAm') stats.halfAm += 1;
                else if (bucket === 'halfPm') stats.halfPm += 1;
                else stats.fullDay += 1;
                if (row.source === 'baseline') stats.baseline += 1;
                else stats.user += 1;
            });
            return stats;
        };

        const generateLeaveImportReport = (options = {}) => {
            const year = Number(options.year ?? 2026);
            const month = Number(options.month ?? 7);
            const prefix = `${year}-${String(month).padStart(2, '0')}-`;
            const registry = Array.isArray(options.registry) ? options.registry : getLeaveRegistry();
            const normalized = registry
                .filter(row => String(row?.date || '').startsWith(prefix))
                .map(normalizeLeaveImportReportRow)
                .filter(row => row.storeId && row.date && row.employeeId);

            normalized.sort((a, b) => {
                const storeIdxA = LEAVE_IMPORT_REPORT_STORE_ORDER.indexOf(a.storeId);
                const storeIdxB = LEAVE_IMPORT_REPORT_STORE_ORDER.indexOf(b.storeId);
                const sA = storeIdxA >= 0 ? storeIdxA : 99;
                const sB = storeIdxB >= 0 ? storeIdxB : 99;
                if (sA !== sB) return sA - sB;
                const empA = getEmployee(a.employeeId);
                const empB = getEmployee(b.employeeId);
                const sortA = empA?.sortOrder ?? 9999;
                const sortB = empB?.sortOrder ?? 9999;
                if (sortA !== sortB) return sortA - sortB;
                const nameCmp = (a.employeeName || '').localeCompare(b.employeeName || '', 'zh-Hant');
                if (nameCmp) return nameCmp;
                return String(a.date).localeCompare(String(b.date));
            });

            const stores = [];
            const byStore = new Map();
            normalized.forEach(row => {
                if (!byStore.has(row.storeId)) {
                    byStore.set(row.storeId, {
                        storeId: row.storeId,
                        storeName: row.storeName,
                        employees: new Map()
                    });
                }
                const storeBlock = byStore.get(row.storeId);
                const empKey = row.employeeId;
                if (!storeBlock.employees.has(empKey)) {
                    storeBlock.employees.set(empKey, {
                        employeeId: row.employeeId,
                        employeeNo: row.employeeNo,
                        employeeName: row.employeeName,
                        entries: []
                    });
                }
                storeBlock.employees.get(empKey).entries.push({
                    date: row.date,
                    dateLabel: row.dateLabel,
                    leaveType: row.leaveType,
                    display: row.display,
                    duration: row.duration,
                    period: row.period,
                    source: row.source
                });
            });

            LEAVE_IMPORT_REPORT_STORE_ORDER.forEach(code => {
                const block = byStore.get(code);
                if (!block) return;
                const employees = [...block.employees.values()].sort((a, b) => {
                    const ea = getEmployee(a.employeeId);
                    const eb = getEmployee(b.employeeId);
                    const sa = ea?.sortOrder ?? 9999;
                    const sb = eb?.sortOrder ?? 9999;
                    if (sa !== sb) return sa - sb;
                    return (a.employeeName || '').localeCompare(b.employeeName || '', 'zh-Hant');
                });
                employees.forEach(emp => {
                    emp.entries.sort((x, y) => String(x.date).localeCompare(String(y.date)));
                });
                stores.push({
                    storeId: block.storeId,
                    storeName: block.storeName,
                    employees
                });
            });

            return {
                meta: {
                    feature: 'Feature-010D.1',
                    generatedAt: new Date().toISOString(),
                    period: `${year}-${String(month).padStart(2, '0')}`,
                    registryKey: LEAVE_STORAGE_KEY
                },
                statistics: buildLeaveImportReportStatistics(normalized),
                stores,
                rows: normalized
            };
        };

        const serializeLeaveImportReportToCsv = report => {
            const header = [
                'storeId', 'storeName', 'employeeName', 'employeeNo', 'date', 'dateLabel',
                'leaveType', 'display', 'duration', 'period', 'source'
            ];
            const escapeCsv = value => {
                const text = String(value ?? '');
                if (/[",\n]/.test(text)) return `"${text.replace(/"/g, '""')}"`;
                return text;
            };
            const lines = [header.join(',')];
            (report?.rows || []).forEach(row => {
                lines.push(header.map(key => escapeCsv(row[key])).join(','));
            });
            return lines.join('\n');
        };

        const downloadLeaveImportReportFile = (filename, content, mimeType) => {
            const blob = new Blob([content], { type: mimeType || 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = filename;
            anchor.rel = 'noopener';
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            URL.revokeObjectURL(url);
        };

        const exportLeaveImportReportJson = (filename = 'leave-import-report-202607.json', options = {}) => {
            const report = generateLeaveImportReport(options);
            downloadLeaveImportReportFile(
                filename,
                JSON.stringify(report, null, 2),
                'application/json;charset=utf-8'
            );
            return report;
        };

        const exportLeaveImportReportCsv = (filename = 'leave-import-report-202607.csv', options = {}) => {
            const report = generateLeaveImportReport(options);
            downloadLeaveImportReportFile(
                filename,
                serializeLeaveImportReportToCsv(report),
                'text/csv;charset=utf-8'
            );
            return report;
        };

        window.generateLeaveImportReport = generateLeaveImportReport;
        window.exportLeaveImportReportJson = exportLeaveImportReportJson;
        window.exportLeaveImportReportCsv = exportLeaveImportReportCsv;

        const createLeave = async data => {
            const employeeId = normalizeLeaveEmployeeId(data?.employeeId);
            const storeCode = normalizeStoreIdCode(data?.storeId);
            const date = String(data?.date || '').trim();
            const leaveType = String(data?.leaveType || '').trim();
            const note = String(data?.note || '').trim();
            const windowCheck = assertLeaveSelectionWindowMutation({
                storeId: storeCode,
                employeeId,
                leaveType
            });
            if (!windowCheck.ok) return windowCheck;
            if (!isLeaveTypeStorageAllowed(leaveType)) {
                return { ok: false, message: '此假別尚未開放。' };
            }
            if (!employeeId || !getEmployee(data?.employeeId)) {
                return { ok: false, message: '找不到員工資料。' };
            }
            if (!storeCode || !isStoreActive(storeCode)) {
                return { ok: false, message: '門市無效或尚未開放。' };
            }
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
                return { ok: false, message: '日期格式無效。' };
            }
            if (!leaveType) return { ok: false, message: '請指定假別。' };
            const storedLeaveType = isVacationGeneralLeaveType(leaveType) ? LEAVE_TYPE_VACATION : leaveType;
            if (findLeaveConflict(employeeId, storeCode, date, null, getLeavePeriodFromRow({ note }))) {
                return { ok: false, message: '此員工當日已有請假紀錄。' };
            }
            if (!isLeaveCloudReady()) {
                return { ok: false, message: '請假需雲端登入後才能儲存，資料未寫入。' };
            }
            try {
                await ensureSupabaseStoreUuidMap();
                const storeUuid = state.supabaseStoreUuidByCode?.[storeCode];
                if (!storeUuid) return { ok: false, message: '找不到門市對應的雲端資料。' };
                const employeeNo = resolveLeaveCloudEmployeeNo(employeeId);
                const profileId = await resolveLeaveCloudProfileId(employeeNo);
                if (!profileId) {
                    return { ok: false, message: '找不到該員工的雲端帳號（profiles），無法寫入請假。' };
                }
                const authUid = state.authUser?.id || null;
                const { data: inserted, error } = await getSupabaseClient()
                    .from('leave_requests')
                    .insert({
                        store_id: storeUuid,
                        employee_id: profileId,
                        employee_no: employeeNo,
                        leave_date: date,
                        leave_type: storedLeaveType,
                        note,
                        created_by: authUid,
                        updated_by: authUid
                    })
                    .select('*')
                    .single();
                if (error) {
                    console.error('[ZDOS leave] insert leave_requests failed', error);
                    return { ok: false, message: error.message || '雲端新增請假失敗，資料未儲存。' };
                }
                const record = mapCloudLeaveRowToRegistry(inserted);
                const withoutDup = getLeaveRegistry().filter(row => row.id !== record.id);
                state.leaveRegistry = withoutDup.concat([record]);
                saveLeaveRegistry();
                return { ok: true, leave: record };
            } catch (err) {
                console.error('[ZDOS leave] createLeave exception', err);
                return { ok: false, message: err?.message || '雲端新增請假失敗，資料未儲存。' };
            }
        };

        const updateLeave = async (id, data) => {
            const idx = getLeaveRegistry().findIndex(row => row.id === id);
            if (idx < 0) return { ok: false, message: '找不到請假紀錄。' };
            const current = state.leaveRegistry[idx];
            const employeeId = normalizeLeaveEmployeeId(data?.employeeId ?? current.employeeId);
            const storeCode = normalizeStoreIdCode(data?.storeId ?? current.storeId);
            const date = String(data?.date ?? current.date).trim();
            const leaveType = String(data?.leaveType ?? current.leaveType).trim();
            const note = data?.note !== undefined ? String(data.note || '').trim() : String(current.note || '').trim();
            const windowCheck = assertLeaveSelectionWindowMutation({
                storeId: storeCode,
                employeeId,
                leaveType,
                existingLeave: current
            });
            if (!windowCheck.ok) return windowCheck;
            if (!isLeaveTypeStorageAllowed(leaveType)) {
                return { ok: false, message: '此假別尚未開放。' };
            }
            if (!employeeId || !getEmployee(employeeId)) {
                return { ok: false, message: '找不到員工資料。' };
            }
            if (!storeCode || !isStoreActive(storeCode)) {
                return { ok: false, message: '門市無效或尚未開放。' };
            }
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
                return { ok: false, message: '日期格式無效。' };
            }
            if (!leaveType) return { ok: false, message: '請指定假別。' };
            const storedLeaveType = isVacationGeneralLeaveType(leaveType) ? LEAVE_TYPE_VACATION : leaveType;
            if (findLeaveConflict(employeeId, storeCode, date, id, getLeavePeriodFromRow({ note }))) {
                return { ok: false, message: '此員工當日已有其他請假紀錄。' };
            }
            if (!isLeaveCloudReady()) {
                return { ok: false, message: '請假需雲端登入後才能儲存，資料未寫入。' };
            }
            try {
                await ensureSupabaseStoreUuidMap();
                const storeUuid = state.supabaseStoreUuidByCode?.[storeCode];
                if (!storeUuid) return { ok: false, message: '找不到門市對應的雲端資料。' };
                const employeeNo = resolveLeaveCloudEmployeeNo(employeeId);
                const profileId = await resolveLeaveCloudProfileId(employeeNo);
                if (!profileId) {
                    return { ok: false, message: '找不到該員工的雲端帳號（profiles），無法更新請假。' };
                }
                const authUid = state.authUser?.id || null;
                const { data: updated, error } = await getSupabaseClient()
                    .from('leave_requests')
                    .update({
                        store_id: storeUuid,
                        employee_id: profileId,
                        employee_no: employeeNo,
                        leave_date: date,
                        leave_type: storedLeaveType,
                        note,
                        updated_by: authUid
                    })
                    .eq('id', id)
                    .select('*')
                    .single();
                if (error) {
                    console.error('[ZDOS leave] update leave_requests failed', error);
                    return { ok: false, message: error.message || '雲端更新請假失敗，資料未儲存。' };
                }
                const record = mapCloudLeaveRowToRegistry(updated);
                state.leaveRegistry[idx] = record;
                saveLeaveRegistry();
                return { ok: true, leave: record };
            } catch (err) {
                console.error('[ZDOS leave] updateLeave exception', err);
                return { ok: false, message: err?.message || '雲端更新請假失敗，資料未儲存。' };
            }
        };

        const deleteLeave = async id => {
            const target = getLeaveRegistry().find(row => row.id === id);
            if (!target) {
                return { ok: false, message: '找不到請假紀錄。' };
            }
            const windowCheck = assertLeaveSelectionWindowDelete(target);
            if (!windowCheck.ok) return windowCheck;
            if (!isLeaveCloudReady()) {
                return { ok: false, message: '請假需雲端登入後才能刪除，資料未變更。' };
            }
            try {
                const client = getSupabaseClient();
                const { data: deletedRows, error } = await client
                    .from('leave_requests')
                    .delete()
                    .eq('id', id)
                    .select('id');
                if (error) {
                    console.error('[ZDOS leave] delete leave_requests failed', error);
                    return { ok: false, message: error.message || '雲端刪除請假失敗，資料未變更。' };
                }
                if (!Array.isArray(deletedRows) || deletedRows.length === 0) {
                    console.error('[ZDOS leave] delete leave_requests blocked (0 rows)', id);
                    return {
                        ok: false,
                        message: '雲端拒絕取消此休假（可能非本人 pending、或需主管權限）。資料未變更。'
                    };
                }
                const removed = { ...target };
                state.leaveRegistry = getLeaveRegistry().filter(row => row.id !== id);
                saveLeaveRegistry();
                return { ok: true, leave: removed };
            } catch (err) {
                console.error('[ZDOS leave] deleteLeave exception', err);
                return { ok: false, message: err?.message || '雲端刪除請假失敗，資料未變更。' };
            }
        };

        const getReportRegistry = () => (Array.isArray(state.reportRegistry) ? state.reportRegistry : []);

        const saveReportRegistry = () => {
            if (isSalesCloudEnabled()) return;
            state.reportRegistry = getReportRegistry();
            safeSetItem(REPORT_STORAGE_KEY, JSON.stringify(state.reportRegistry));
        };

        const normalizeReportNumber = (value, fallback = 0) => {
            if (value === '' || value === null || value === undefined) return fallback;
            const n = Number(value);
            return Number.isFinite(n) ? n : fallback;
        };

        const findReportConflict = (storeId, date, shift, excludeId = null) => {
            const storeCode = normalizeStoreIdCode(storeId);
            const day = String(date || '').trim();
            const shiftKey = String(shift || '').trim();
            if (!storeCode || !day || !shiftKey) return null;
            return getReportRegistry().find(row => {
                if (excludeId && row.id === excludeId) return false;
                return normalizeStoreIdCode(row.storeId) === storeCode
                    && String(row.date || '').trim() === day
                    && String(row.shift || '').trim() === shiftKey;
            }) || null;
        };

        const getReports = () => getReportRegistry();

        const getReportsByMonth = (year, month) => {
            const y = Number(year);
            const m = Number(month);
            if (!Number.isFinite(y) || !Number.isFinite(m) || m < 1 || m > 12) return [];
            const prefix = `${y}-${String(m).padStart(2, '0')}-`;
            return getReportRegistry().filter(row => String(row.date || '').startsWith(prefix));
        };

        const getReportsByDate = date => {
            const day = String(date || '').trim();
            if (!day) return [];
            return getReportRegistry().filter(row => String(row.date || '').trim() === day);
        };

        const getReportsByStore = storeId => {
            const storeCode = normalizeStoreIdCode(storeId);
            if (!storeCode) return [];
            return getReportRegistry().filter(row => normalizeStoreIdCode(row.storeId) === storeCode);
        };

        const buildReportRecordFields = (data, base = {}) => ({
            storeId: normalizeStoreIdCode(data?.storeId ?? base.storeId) || '',
            date: String(data?.date ?? base.date ?? '').trim(),
            shift: String(data?.shift ?? base.shift ?? '').trim(),
            revenue: normalizeReportNumber(data?.revenue ?? base.revenue, 0),
            cash: normalizeReportNumber(data?.cash ?? base.cash, 0),
            creditCard: normalizeReportNumber(data?.creditCard ?? base.creditCard, 0),
            mobilePay: normalizeReportNumber(data?.mobilePay ?? base.mobilePay, 0),
            otherIncome: normalizeReportNumber(data?.otherIncome ?? base.otherIncome, 0),
            customerCount: normalizeReportNumber(data?.customerCount ?? base.customerCount, 0),
            note: String(data?.note ?? base.note ?? '').trim()
        });

        const validateReportCoreFields = fields => {
            if (!fields.storeId) return { ok: false, message: '請指定門市。' };
            if (!fields.date) return { ok: false, message: '請指定日期。' };
            if (!fields.shift) return { ok: false, message: '請指定班別。' };
            return { ok: true };
        };

        const createReport = data => {
            const fields = buildReportRecordFields(data);
            const coreCheck = validateReportCoreFields(fields);
            if (!coreCheck.ok) return coreCheck;
            if (findReportConflict(fields.storeId, fields.date, fields.shift)) {
                return { ok: false, message: '此門市、日期、班別已有報表紀錄。' };
            }
            const now = new Date().toISOString();
            const record = {
                id: `report-${Date.now()}`,
                ...fields,
                createdAt: now,
                updatedAt: now
            };
            state.reportRegistry = getReportRegistry();
            state.reportRegistry.push(record);
            saveReportRegistry();
            return { ok: true, report: record };
        };

        const updateReport = (id, data) => {
            const idx = getReportRegistry().findIndex(row => row.id === id);
            if (idx < 0) return { ok: false, message: '找不到報表紀錄。' };
            const current = state.reportRegistry[idx];
            const fields = buildReportRecordFields(data, current);
            const coreCheck = validateReportCoreFields(fields);
            if (!coreCheck.ok) return coreCheck;
            if (findReportConflict(fields.storeId, fields.date, fields.shift, id)) {
                return { ok: false, message: '此門市、日期、班別已有其他報表紀錄。' };
            }
            const now = new Date().toISOString();
            state.reportRegistry[idx] = {
                ...current,
                ...fields,
                updatedAt: now
            };
            saveReportRegistry();
            return { ok: true, report: state.reportRegistry[idx] };
        };

        const deleteReport = id => {
            const target = getReportRegistry().find(row => row.id === id);
            if (!target) {
                return { ok: false, message: '找不到報表紀錄。' };
            }
            const removed = { ...target };
            state.reportRegistry = getReportRegistry().filter(row => row.id !== id);
            saveReportRegistry();
            return { ok: true, report: removed };
        };

        // ========================================================================
        // Attendance Core（Feature-010C）— Type Master + Record Registry
        // ========================================================================
        const mkAttendanceType = (code, name, opts = {}) => ({
            id: code,
            code,
            name,
            category: opts.category || 'LEAVE',
            color: opts.color || '#94a3b8',
            icon: opts.icon || '•',
            isPaid: opts.isPaid !== false,
            requiresApproval: opts.requiresApproval !== false,
            annualQuota: opts.annualQuota ?? null,
            allowHalfDay: opts.allowHalfDay !== false,
            countsAsWorkday: opts.countsAsWorkday === true,
            countsAsLeave: opts.countsAsLeave !== false,
            requiresSchedule: opts.requiresSchedule === true,
            sortOrder: opts.sortOrder ?? 0,
            status: opts.status || 'active'
        });

        const ATTENDANCE_TYPE_REGISTRY = [
            mkAttendanceType('WORK', '上班', {
                category: 'WORK',
                color: '#34d399',
                icon: '💼',
                requiresApproval: false,
                countsAsWorkday: true,
                countsAsLeave: false,

            }),

        const ATTENDANCE_SOURCE_LABELS = {
            AUTO: '自動',
            MANUAL: '手動',
            IMPORT: '匯入',
            AI: 'AI'
        };

        const ATTENDANCE_STATUS_LABELS = {
            pending: '待審',
            approved: '核准',
            rejected: '拒絕',
            cancelled: '取消'
        };

        const getAttendanceTypes = () =>
            [...ATTENDANCE_TYPE_REGISTRY]
                .filter(row => row.status === 'active')
                .sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));

        const getAttendanceType = ref => {
            const key = String(ref || '').trim();
            if (!key) return null;
            return ATTENDANCE_TYPE_REGISTRY.find(row => row.id === key || row.code === key) || null;
        };

        const getAttendanceRecords = () =>
            Array.isArray(state.attendanceRecordRegistry) ? state.attendanceRecordRegistry : [];

        const getAttendanceRecordsByEmployee = employeeId => {
            const key = String(employeeId || '').trim();
            if (!key) return [];
            return getAttendanceRecords().filter(row => String(row.employeeId || '').trim() === key);
        };

        const buildAttendanceMonthPrefix = (year, month) =>
            `${Number(year)}-${String(Number(month)).padStart(2, '0')}-`;

        const getAttendanceRecordsByMonth = (year, month, employeeId = null) => {
            const prefix = buildAttendanceMonthPrefix(year, month);
            const empKey = employeeId ? String(employeeId).trim() : '';
            return getAttendanceRecords()
                .filter(row => String(row.date || '').startsWith(prefix))
                .filter(row => !empKey || String(row.employeeId || '').trim() === empKey)
                .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
        };

        const getApprovedAttendanceRecords = () =>
            getAttendanceRecords().filter(row => row.status === 'approved');

        // ========================================================================
        // Leave Engine（Feature-010C）— 人力中心排假引擎（與 Schedule Leave Registry 分離）
        // ========================================================================
        const WORKFORCE_LEAVE_TYPES = ['SELF', 'COMPANY'];
        const WORKFORCE_LEAVE_STATUSES = ['pending', 'approved', 'rejected'];

        const saveWorkforceLeaveRecords = () => {
            state.workforceLeaveRecords = getLeaveRecords();
            safeSetItem(WORKFORCE_LEAVE_ENGINE_KEY, JSON.stringify(state.workforceLeaveRecords));
        };

        const getLeaveRecords = () => (Array.isArray(state.workforceLeaveRecords) ? state.workforceLeaveRecords : []);

        const buildLeaveMonthPrefix = (year, month) =>
            `${Number(year)}-${String(Number(month)).padStart(2, '0')}-`;

        const normalizeWorkforceLeaveType = value => {
            const key = String(value || '').trim().toUpperCase();
            return WORKFORCE_LEAVE_TYPES.includes(key) ? key : '';
        };

        const isWorkforceLeaveCountable = record =>
            record && record.status !== 'rejected';

        const getLeaveByEmployee = employeeId => {
            const key = String(employeeId || '').trim();
            if (!key) return [];
            return getLeaveRecords().filter(row => String(row.employeeId || '').trim() === key);
        };

        const getLeaveByMonth = (year, month, employeeId = null) => {
            const prefix = buildLeaveMonthPrefix(year, month);
            const empKey = employeeId ? String(employeeId).trim() : '';
            return getLeaveRecords().filter(row => {
                if (!String(row.date || '').startsWith(prefix)) return false;
                if (empKey && String(row.employeeId || '').trim() !== empKey) return false;
                return true;
            });
        };

        const countWorkforceLeaveUsage = (employeeId, year, month, leaveType = null) => {
            const empKey = String(employeeId || '').trim();
            return getLeaveByMonth(year, month, empKey).filter(row => {
                if (!isWorkforceLeaveCountable(row)) return false;
                if (leaveType && row.leaveType !== leaveType) return false;
                return true;
            }).length;
        };

        const getRemainingSelfLeave = (employeeId, year, month) => {
            const emp = getEmployee(employeeId);
            if (!emp || emp.employmentType !== 'full_time') return 0;
            const used = countWorkforceLeaveUsage(employeeId, year, month, 'SELF');
            return Math.max(0, (emp.selfLeaveQuota || 0) - used);
        };

        const getRemainingCompanyLeave = (employeeId, year, month) => {
            const emp = getEmployee(employeeId);
            if (!emp || emp.employmentType !== 'full_time') return 0;
            const used = countWorkforceLeaveUsage(employeeId, year, month, 'COMPANY');
            return Math.max(0, (emp.companyLeaveQuota || 0) - used);
        };

        const getRemainingMonthlyLeave = (employeeId, year, month) => {
            const emp = getEmployee(employeeId);
            if (!emp || emp.employmentType !== 'full_time') return 0;
            const used = countWorkforceLeaveUsage(employeeId, year, month);
            return Math.max(0, (emp.monthlyLeaveQuota || 0) - used);
        };

        const findWorkforceLeaveConflict = (employeeId, date, excludeId = null) => {
            const empKey = String(employeeId || '').trim();
            const day = String(date || '').trim();
            if (!empKey || !day) return null;
            return getLeaveRecords().find(row => {
                if (excludeId && row.id === excludeId) return false;
                return String(row.employeeId || '').trim() === empKey
                    && String(row.date || '').trim() === day
                    && row.status !== 'rejected';
            }) || null;
        };

        const createWorkforceLeaveRecord = data => {
            const employeeId = String(data?.employeeId || '').trim();
            const emp = getEmployee(employeeId);
            if (!emp) return { ok: false, message: '找不到員工資料。' };
            if (emp.employmentType !== 'full_time') {
                return { ok: false, message: '兼職員工不使用 Leave Engine。' };
            }
            const storeCode = normalizeStoreIdCode(data?.storeId ?? emp.storeId);
            const date = String(data?.date || '').trim();
            const leaveType = normalizeWorkforceLeaveType(data?.leaveType);
            const note = String(data?.note || '').trim();
            if (!storeCode) return { ok: false, message: '請指定門市。' };
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return { ok: false, message: '日期格式無效。' };
            if (!leaveType) return { ok: false, message: '請選擇假別（SELF / COMPANY）。' };
            if (findWorkforceLeaveConflict(employeeId, date)) {
                return { ok: false, message: '此員工當日已有排假紀錄。' };
            }
            const parts = date.split('-').map(Number);
            const y = parts[0];
            const m = parts[1];
            if (leaveType === 'SELF' && getRemainingSelfLeave(employeeId, y, m) <= 0) {
                return { ok: false, message: '自選假額度已用完。' };
            }
            if (leaveType === 'COMPANY' && getRemainingCompanyLeave(employeeId, y, m) <= 0) {
                return { ok: false, message: '公司假額度已用完。' };
            }
            if (getRemainingMonthlyLeave(employeeId, y, m) <= 0) {
                return { ok: false, message: '本月排假額度已用完。' };
            }
            const now = new Date().toISOString();
            const record = {
                id: `wleave-${Date.now()}`,
                employeeId: emp.id,
                storeId: storeCode,
                date,
                leaveType,
                status: 'pending',
                note,
                createdAt: now,
                updatedAt: now
            };
            state.workforceLeaveRecords = getLeaveRecords();
            state.workforceLeaveRecords.push(record);
            saveWorkforceLeaveRecords();
            return { ok: true, record };
        };

        const getWorkforceLeaveEligibleEmployees = () => {
            const storeCode = normalizeStoreIdCode(state.storeType) || getActiveStores()[0]?.code;
            if (!storeCode) return [];
            return getFullTimeEmployees().filter(emp =>
                emp.status === 'active' && emp.storeId === storeCode
            );
        };

        const ensureWorkforceLeaveActiveEmployee = () => {
            const eligible = getWorkforceLeaveEligibleEmployees();
            const current = getEmployee(state.workforceLeaveActiveEmployeeId);
            if (current && current.employmentType === 'full_time' && eligible.some(e => e.id === current.id)) {
                return current.id;
            }
            const next = eligible[0]?.id || null;
            state.workforceLeaveActiveEmployeeId = next;
            return next;
        };

        // ========================================================================
        // Auto Schedule Engine（Feature-010D）— 正職依 Leave Engine 自動產班（獨立於 Schedule Registry）
        // ========================================================================
        const WORKFORCE_SCHEDULE_STATUSES = ['WORK', 'OFF'];
        const WORKFORCE_SCHEDULE_SOURCE_AUTO = 'AUTO';

        const getWorkforceAutoScheduleRecords = () =>
            (Array.isArray(state.workforceAutoSchedule) ? state.workforceAutoSchedule : []);

        const saveWorkforceAutoSchedule = () => {
            state.workforceAutoSchedule = getWorkforceAutoScheduleRecords();
            safeSetItem(WORKFORCE_AUTO_SCHEDULE_KEY, JSON.stringify(state.workforceAutoSchedule));
        };

        const getApprovedWorkforceLeave = (employeeId, dateStr) => {
            const empKey = String(employeeId || '').trim();
            const day = String(dateStr || '').trim();
            if (!empKey || !day) return null;
            return getLeaveRecords().find(row =>
                String(row.employeeId || '').trim() === empKey
                && String(row.date || '').trim() === day
                && row.status === 'approved'
            ) || null;
        };

        const buildAutoScheduleMonthDates = (year, month) => {
            const y = Number(year);
            const m = Number(month);
            if (!Number.isFinite(y) || !Number.isFinite(m) || m < 1 || m > 12) return [];
            const daysInMonth = new Date(y, m, 0).getDate();
            const dates = [];
            for (let day = 1; day <= daysInMonth; day += 1) {
                dates.push(`${y}-${String(m).padStart(2, '0')}-${String(day).padStart(2, '0')}`);
            }
            return dates;
        };

        const buildAutoScheduleDayRecord = (emp, dateStr, approvedLeave) => {
            if (approvedLeave) {
                return {
                    employeeId: emp.id,
                    date: dateStr,
                    status: 'OFF',
                    shiftId: '',
                    storeId: emp.storeId,
                    source: WORKFORCE_SCHEDULE_SOURCE_AUTO,
                    leaveType: normalizeWorkforceLeaveType(approvedLeave.leaveType) || approvedLeave.leaveType
                };
            }
            return {
                employeeId: emp.id,
                date: dateStr,
                status: 'WORK',
                shiftId: emp.defaultShiftId || '',
                storeId: emp.storeId,
                source: WORKFORCE_SCHEDULE_SOURCE_AUTO,
                leaveType: ''
            };
        };

        const generateEmployeeSchedule = (employeeId, year, month) => {
            const emp = getEmployee(employeeId);
            if (!emp || emp.employmentType !== 'full_time' || emp.status !== 'active') return [];
            return buildAutoScheduleMonthDates(year, month).map(dateStr => {
                const approvedLeave = getApprovedWorkforceLeave(emp.id, dateStr);
                return buildAutoScheduleDayRecord(emp, dateStr, approvedLeave);
            });
        };

        const mergeAutoScheduleForMonth = (newRows, year, month) => {
            const prefix = buildLeaveMonthPrefix(year, month);
            const newEmployeeIds = new Set(newRows.map(row => row.employeeId));
            const kept = getWorkforceAutoScheduleRecords().filter(row => {
                if (!String(row.date || '').startsWith(prefix)) return true;
                return !newEmployeeIds.has(row.employeeId);
            });
            state.workforceAutoSchedule = [...kept, ...newRows];
            saveWorkforceAutoSchedule();
            return getWorkforceAutoScheduleRecords();
        };

        const generateMonthlySchedule = (year, month) => {
            const y = Number(year);
            const m = Number(month);
            const employees = getFullTimeEmployees().filter(emp => emp.status === 'active');
            const generated = [];
            employees.forEach(emp => {
                generated.push(...generateEmployeeSchedule(emp.id, y, m));
            });
            return mergeAutoScheduleForMonth(generated, y, m);
        };

        const getAutoScheduleEntry = (employeeId, dateStr) => {
            const empKey = String(employeeId || '').trim();
            const day = String(dateStr || '').trim();
            if (!empKey || !day) return null;
            return getWorkforceAutoScheduleRecords().find(row =>
                String(row.employeeId || '').trim() === empKey
                && String(row.date || '').trim() === day
            ) || null;
        };

        const isLeaveDay = (employeeId, dateStr) => {
            const entry = getAutoScheduleEntry(employeeId, dateStr);
            if (entry) return entry.status === 'OFF';
            return !!getApprovedWorkforceLeave(employeeId, dateStr);
        };

        const isWorkDay = (employeeId, dateStr) => {
            const emp = getEmployee(employeeId);
            if (!emp || emp.employmentType !== 'full_time') return false;
            const entry = getAutoScheduleEntry(employeeId, dateStr);
            if (entry) return entry.status === 'WORK';
            return !getApprovedWorkforceLeave(employeeId, dateStr);
        };

        const getAutoScheduleForEmployeeMonth = (employeeId, year, month) => {
            const prefix = buildLeaveMonthPrefix(year, month);
            const empKey = String(employeeId || '').trim();
            return getWorkforceAutoScheduleRecords().filter(row =>
                String(row.employeeId || '').trim() === empKey
                && String(row.date || '').startsWith(prefix)
            );
        };

        const sortReportsByDateDesc = rows => [...(Array.isArray(rows) ? rows : [])].sort((a, b) => {
            const byDate = String(b.date || '').localeCompare(String(a.date || ''));
            if (byDate !== 0) return byDate;
            return String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || ''));
        });

        const getReportStoreDisplayName = storeId => {
            const code = normalizeStoreIdCode(storeId);
            if (!code) return String(storeId || '-');
            return getStoreByCode(code)?.name || code;
        };

        const renderReportFormStoreOptions = selectedCode => {
            const selected = normalizeStoreIdCode(selectedCode) || '';
            return getActiveStores().map(store => {
                const isSelected = store.code === selected ? ' selected' : '';
                return `<option value="${escapeHtmlText(store.code)}"${isSelected}>${escapeHtmlText(store.name)}（${escapeHtmlText(store.code)}）</option>`;
            }).join('');
        };

        const renderReportFormShiftOptions = selectedName => {
            const selected = String(selectedName || '').trim();
            return getShiftRegistry().map(shift => {
                const isSelected = shift.name === selected ? ' selected' : '';
                return `<option value="${escapeHtmlText(shift.name)}"${isSelected}>${escapeHtmlText(shift.name)}</option>`;
            }).join('');
        };

        const resolveLeaveTypeKey = leaveType => resolveLeaveTypeCssKey(leaveType);

        const getLeaveTypeLabel = (leaveType, leaveRow = null) => {
            const display = String(leaveRow?.display || '').trim();
            if (display) return display;
            const t = String(leaveType || '').trim();
            const def = getLeaveTypeDefinition(t);
            if (def?.label) return def.label;
            if (isVacationGeneralLeaveType(t)) return LEAVE_TYPE_VACATION;
            if (t === LEAVE_TYPE_VACATION_CHOICE) return LEAVE_TYPE_VACATION_CHOICE;
            if (t === 'REST') return '休';
            if (t === 'PERSONAL') return '事假';
            if (t === 'SICK') return '病假';
            if (t === 'PUBLIC') return '公假';
            if (t === 'ABSENT') return '曠職';
            const key = resolveLeaveTypeKey(t);
            const labels = {
                annual: '休',
                personal: '事假',
                sick: '病假',
                official: '公假',
                support: '支援'
            };
            if (key !== 'other') return labels[key] || t;
            return t || '其他';
        };

        const getLeaveTypeCompactLabel = (leaveType, leaveRow = null) => {
            const t = String(leaveType || '').trim();
            const def = getLeaveTypeDefinition(t);
            if (def?.compactLabel) return def.compactLabel;
            if (isVacationGeneralLeaveType(t)) return '休假';
            if (t === LEAVE_TYPE_VACATION_CHOICE) return '自選休';
            return getLeaveTypeLabel(leaveType, leaveRow);
        };

        const getLeaveTypeClass = leaveType => getLeaveTypeColorClasses(leaveType);

        const getLeaveForEmployeeStoreDate = (employeeId, dateStr, storeId) => {
            const empKey = normalizeLeaveEmployeeId(employeeId);
            const storeCode = normalizeStoreIdCode(storeId);
            const day = String(dateStr || '').trim();
            if (!empKey || !storeCode || !day) return null;
            return getLeaveRegistry().find(row =>
                String(row.employeeId || '').trim() === empKey
                && String(row.date || '').trim() === day
                && normalizeStoreIdCode(row.storeId) === storeCode
            ) || null;
        };

        const renderLeaveTypeLegend = () => {
            const items = [
                { label: '上休', cssKey: 'annual' },
                { label: '下休', cssKey: 'annual' },
                { label: LEAVE_TYPE_VACATION, cssKey: 'vacation' },
                { label: LEAVE_TYPE_VACATION_CHOICE, cssKey: 'vacation-choice' },
                { label: '病假', cssKey: 'sick' },
                { label: '事假', cssKey: 'personal' },
                { label: '公假', cssKey: 'official' },
                { label: LEAVE_TYPE_SPECIAL_ANNUAL_LABEL, cssKey: 'special-closed' },
                { label: '曠職', cssKey: 'other' }
            ];
            return items.map(item =>
                `<span class="zdos-scheduling-leave-legend-chip zdos-leave-type--${item.cssKey}"><span class="zdos-scheduling-leave-chip-type">${escapeHtmlText(item.label)}</span></span>`
            ).join('');
        };

        const wireScheduleFormDatePicker = (root) => {
            const dateEl = root?.querySelector?.('#schedule-form-date')
                || document.getElementById('schedule-form-date');
            if (!dateEl || dateEl.type !== 'date') return;
            const openPicker = () => {
                try {
                    if (typeof dateEl.showPicker === 'function') dateEl.showPicker();
                } catch (_) { /* 部分瀏覽器需使用者手勢 */ }
            };
            dateEl.addEventListener('click', openPicker);
        };

        const renderLeaveChip = leave => {
            if (!leave) return '';
            const emp = getEmployee(leave.employeeId);
            const name = emp?.name || '—';
            const typeLabel = getLeaveTypeLabel(leave.leaveType, leave);
            const typeClass = getLeaveTypeClass(leave.leaveType);
            const leaveId = escapeHtmlText(String(leave.id || ''));
            const durationHint = Number(leave.duration) === 0.5 ? ' · 0.5d' : '';
            return `<button type="button" class="zdos-scheduling-leave-chip ${typeClass}" onclick="event.stopPropagation(); openLeaveModal('${leaveId}')"><span class="zdos-scheduling-leave-chip-name">${escapeHtmlText(name)}</span><span class="zdos-scheduling-leave-chip-type">${escapeHtmlText(typeLabel)}${escapeHtmlText(durationHint)}</span></button>`;
        };

        const renderEmployeeLeaveDayMark = leave => {
            if (!leave) return '';
            const typeLabel = getLeaveTypeCompactLabel(leave.leaveType, leave);
            const typeClass = getLeaveTypeClass(leave.leaveType);
            const leaveId = escapeHtmlText(String(leave.id || ''));
            const fullLabel = getLeaveTypeLabel(leave.leaveType, leave);
            return `<button type="button" class="zdos-scheduling-leave-chip ${typeClass} w-full justify-center mt-0.5 py-1" title="${escapeHtmlText(fullLabel)}" onclick="event.stopPropagation(); openLeaveModal('${leaveId}')"><span class="zdos-scheduling-leave-chip-type">${escapeHtmlText(typeLabel)}</span></button>`;
        };

        const getLeavesForSchedulingView = (dateStr, viewStoreId) => {
            const storeCode = normalizeStoreIdCode(viewStoreId);
            const day = String(dateStr || '').trim();
            if (!storeCode || !day) return [];
            return getLeavesByDate(day)
                .filter(row => normalizeStoreIdCode(row.storeId) === storeCode)
                .sort((a, b) => {
                    const na = getEmployee(a.employeeId)?.name || '';
                    const nb = getEmployee(b.employeeId)?.name || '';
                    return na.localeCompare(nb, 'zh-Hant');
                });
        };

        const LEAVE_FORM_TYPE_OPTIONS = getLeaveFormTypeDefinitions()
            .filter(def => def.enabled !== false)
            .map(def => def.storageValues?.[0] || def.label);

        const countSchedulingVacationGeneralLeavesForMonth = (employeeId, storeId, year, month) => {
            const empKey = normalizeLeaveEmployeeId(employeeId);
            const storeCode = normalizeStoreIdCode(storeId);
            const y = Number(year);
            const m = Number(month);
            if (!empKey || !storeCode || !Number.isFinite(y) || !Number.isFinite(m)) return 0;
            const prefix = `${y}-${String(m).padStart(2, '0')}-`;
            return getLeaveRegistry().filter(row => {
                if (normalizeLeaveEmployeeId(row.employeeId) !== empKey) return false;
                if (normalizeStoreIdCode(row.storeId) !== storeCode) return false;
                if (!String(row.date || '').startsWith(prefix)) return false;
                return isVacationGeneralLeaveType(row.leaveType);
            }).length;
        };

        const countSchedulingLeavesForEmployeeMonth = (employeeId, storeId, year, month, leaveTypeExact) => {
            const empKey = normalizeLeaveEmployeeId(employeeId);
            const storeCode = normalizeStoreIdCode(storeId);
            const y = Number(year);
            const m = Number(month);
            if (!empKey || !storeCode || !Number.isFinite(y) || !Number.isFinite(m)) return 0;
            const prefix = `${y}-${String(m).padStart(2, '0')}-`;
            const typeFilter = String(leaveTypeExact || '').trim();
            return getLeaveRegistry().filter(row => {
                if (normalizeLeaveEmployeeId(row.employeeId) !== empKey) return false;
                if (normalizeStoreIdCode(row.storeId) !== storeCode) return false;
                if (!String(row.date || '').startsWith(prefix)) return false;
                if (typeFilter && String(row.leaveType || '').trim() !== typeFilter) return false;
                return true;
            }).length;
        };

        const renderSchedulingVacationLeaveMonthStats = (employeeId, viewStoreId, year, month) => {
