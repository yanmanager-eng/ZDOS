        window.submitLeaveForm = async function(event) {
            event.preventDefault();
            if (!state.leaveModal) return;
            const viewStoreId = getSchedulingViewStoreId();
            if (!viewStoreId) return showToast('無法判斷目前排班門市，請重新登入。', 'error');
            const isEditSubmit = !!state.leaveModal.leaveId;
            const date = document.getElementById('leave-form-date')?.value
                || document.getElementById('leave-edit-date')?.value
                || state.leaveModal.date;
            const endDate = document.getElementById('leave-form-end-date')?.value || date;
            const dateMode = isEditSubmit
                ? 'single'
                : (document.querySelector('input[name="leave-form-date-mode"]:checked')?.value || 'single');
            const leaveScope = isEditSubmit
                ? inferLeaveFormScope(date, state.schedule?.year, state.schedule?.month)
                : (document.querySelector('input[name="leave-form-scope"]:checked')?.value || 'current');
            const period = document.querySelector('input[name="leave-form-period"]:checked')?.value || '全天';
            const employeeId = document.getElementById('leave-form-employee')?.value
                || document.getElementById('leave-edit-employee')?.value
                || '';
            const leaveType = document.getElementById('leave-form-type')?.value
                || document.getElementById('leave-edit-type')?.value
                || '';
            const rawNote = document.getElementById('leave-form-note')?.value || '';
            const note = `${period !== '全天' ? `【${period}】` : ''}${rawNote}`.trim();
            if (!employeeId || !leaveType || !date) {
                return showToast('請完整填寫排假資料。', 'error');
            }
            // 1) 日期合法性
            if (dateMode === 'range') {
                if (!endDate) return showToast('請完整填寫排假資料。', 'error');
                if (endDate < date) return showToast('結束日期不得早於開始日期。', 'error');
            }
            const viewYear = state.schedule?.year;
            const viewMonth = state.schedule?.month;
            const scopeProbeDates = dateMode === 'range' ? [date, endDate] : [date];
            // 2) scope 檢查（以起迄端點即可判斷連續區間是否落在規則內）
            const scopeCheck = validateLeaveFormScope(leaveScope, scopeProbeDates, viewYear, viewMonth);
            if (!scopeCheck.ok) return showToast(scopeCheck.message, 'error');
            // 3) 62 天上限：超過則不建立日期陣列、不寫入
            const rangeResolved = resolveLeaveFormDateList(date, endDate, dateMode);
            if (!rangeResolved.ok) return showToast(rangeResolved.message, 'error');
            const targetDates = rangeResolved.dates;
            const existingLeave = state.leaveModal.leaveId
                ? getLeaveRegistry().find(row => row.id === state.leaveModal.leaveId)
                : null;
            const windowCheck = assertLeaveSelectionWindowMutation({
                storeId: viewStoreId,
                employeeId,
                leaveType,
                existingLeave
            });
            if (!windowCheck.ok) return showToast(windowCheck.message, 'error');
            if (!isLeaveTypeStorageAllowed(leaveType)) {
                return showToast('此假別尚未開放。', 'error');
            }
            const leaveId = state.leaveModal.leaveId;
            // 4) 每一天衝突檢查
            const conflictDates = targetDates.filter(targetDate =>
                findDetailedLeaveConflict({ employeeId, storeId: viewStoreId, date: targetDate, period, excludeId: leaveId || null })
            );
            if (conflictDates.length) {
                return showToast(`休假日期重疊：${conflictDates.slice(0,4).join('、')}${conflictDates.length>4?'…':''}`, 'error');
            }
            // 5) 額度提示／超額確認
            const quotaDate = new Date(`${date}T12:00:00`);
            const quotaSnapshot = getEmployeeLeaveQuotaSnapshot(employeeId, viewStoreId, quotaDate.getFullYear(), quotaDate.getMonth()+1, leaveId || null);
            const requestedUnits = targetDates.length * (period === '全天' ? 1 : .5);
            if (quotaSnapshot.totalQuota > 0 && quotaSnapshot.usedTotal + requestedUnits > quotaSnapshot.totalQuota) {
                const proceed = confirm(`本次送出後將超過每月休假額度（${quotaSnapshot.usedTotal + requestedUnits}／${quotaSnapshot.totalQuota} 天）。仍要繼續嗎？`);
                if (!proceed) return;
            }
            const payload = { employeeId, storeId: viewStoreId, date, leaveType, note };
            const submitBtn = event?.submitter || document.querySelector('#leave-modal button[type="submit"]');
            if (submitBtn) submitBtn.disabled = true;
            let result;
            const createdDates = [];
            let failedDate = null;
            if (leaveId) {
                result = await updateLeave(leaveId, { ...payload, date: targetDates[0] || date });
            } else {
                result = { ok: true };
                for (const targetDate of targetDates) {
                    const one = await createLeave({ ...payload, date: targetDate });
                    if (!one.ok) {
                        result = one;
                        failedDate = targetDate;
                        break;
                    }
                    createdDates.push(targetDate);
                }
            }
            if (submitBtn) submitBtn.disabled = false;
            if (!result.ok) {
                if (!leaveId && createdDates.length) {
                    showToast(
                        `部分日期已建立（${createdDates.slice(0, 4).join('、')}${createdDates.length > 4 ? '…' : ''}），但於 ${failedDate} 失敗：${result.message || '寫入失敗'}。目前仍非真正資料庫 transaction。`,
                        'error'
                    );
                    state.leaveModal = null;
                    const reloadPartial = await fetchLeaveRequestsForCurrentView();

            console.log('[ZDOS leave] handleDeleteLeave', id);
            if (!id) return showToast('找不到休假紀錄。', 'error');
            const target = getLeaveRegistry().find(row => row.id === id);
            if (!target) return showToast('找不到休假紀錄。', 'error');
            if (!canCurrentUserCancelLeave(target)) {
                return showToast(assertLeaveSelectionWindowDelete(target).message || '無權取消此休假。', 'error');
            }
            if (!confirm('確定要取消此休假嗎？')) return;
            const cancelBtn = document.getElementById('leave-edit-cancel-btn');
            if (cancelBtn) cancelBtn.disabled = true;
            const result = await deleteLeave(id);
            if (cancelBtn) cancelBtn.disabled = false;
            if (!result.ok) return showToast(result.message, 'error');
            showToast('休假已取消', 'success');
            state.leaveModal = null;

            event.preventDefault();

            const payload = {
                storeId: document.getElementById('report-form-store')?.value,
                date: document.getElementById('report-form-date')?.value,
                shift: document.getElementById('report-form-shift')?.value,
                revenue: document.getElementById('report-form-revenue')?.value,
                cash: document.getElementById('report-form-cash')?.value,
                creditCard: document.getElementById('report-form-credit-card')?.value,
                mobilePay: document.getElementById('report-form-mobile-pay')?.value,
                otherIncome: document.getElementById('report-form-other-income')?.value,
                customerCount: document.getElementById('report-form-customer-count')?.value,
                note: document.getElementById('report-form-note')?.value || ''
            };
            const reportId = state.reportModal.reportId;

            if (isSalesCloudEnabled() && state.supabaseSessionReady) {
                if (reportId) {
                    const existing = getReportRegistry().find(r => r.id === reportId);
                    if (existing?.status === 'approved') {
                        return showToast('已核對資料不可直接修改。', 'error');
                    }
                    const dup = await findCloudDuplicateReport({
                        storeCode: payload.storeId,
                        businessDate: payload.date,
                        shift: payload.shift,
                        reportType: existing?.reportType || 'daily_shift',
                        excludeId: reportId
                    });
                    if (dup) return showToast('此門市、日期、班別已有其他報表紀錄。', 'error');
                    const result = await updateCloudSalesReport(reportId, {
                        revenue: normalizeReportNumber(payload.revenue, 0),
                        customerCount: normalizeReportNumber(payload.customerCount, 0),
                        cashAmount: normalizeReportNumber(payload.cash, 0),
                        digitalAmount: normalizeReportNumber(payload.mobilePay, 0),
                        otherAmount: normalizeReportNumber(payload.otherIncome, 0),
                        note: payload.note
                    });
                    if (!result.ok) return showToast(result.message, 'error');
                } else {
                    const result = await insertCloudSalesReport({
                        storeCode: payload.storeId,
                        businessDate: payload.date,
                        shift: payload.shift,
                        reportType: 'daily_shift',
                        revenue: normalizeReportNumber(payload.revenue, 0),
                        customerCount: normalizeReportNumber(payload.customerCount, 0),
                        cashAmount: normalizeReportNumber(payload.cash, 0),
                        digitalAmount: normalizeReportNumber(payload.mobilePay, 0),
                        otherAmount: normalizeReportNumber(payload.otherIncome, 0),
                        note: payload.note,
                        status: 'submitted'
                    });
                    if (!result.ok) return showToast(result.message, 'error');
                }
                showToast(reportId ? '報表已更新（雲端）。' : '新增報表成功（雲端）。', 'success');
                state.reportModal = null;
                renderApp();
                return;
            }

            const result = reportId
                ? updateReport(reportId, payload)
                : createReport(payload);
            if (!result.ok) return showToast(result.message, 'error');
            showToast(reportId ? '報表已更新。' : '新增報表成功。', 'success');
            state.reportModal = null;
            renderApp();
        };

        window.toggleForcePwdVisibility = function(field) {

        window.handleForcePasswordChangeSubmit = function() {
            const fp = state.forcePwd;
            if (!fp || fp.submitting) return; // prevent duplicate submit
            const newPass = String(fp.newPassword || '');
            const confirmPass = String(fp.confirmPassword || '');
            const validationError = validateForcePassword(newPass, confirmPass);
            if (validationError) { fp.error = validationError; renderApp(); return; }
            fp.error = '';
            fp.submitting = true;
            renderApp();
            void (async () => {
                const client = getSupabaseClient();
                try {
                    if (!client || !state.authUser?.id) {
                        state.forcePwd.submitting = false;
                        state.forcePwd.error = '登入狀態已失效，請重新登入';
                        renderApp();
                        return;
                    }
                    const userId = state.authUser.id;
                    // Step 1-2: update Supabase Auth password, confirm no error before anything else.
                    const { error: authErr } = await client.auth.updateUser({ password: newPass });
                    if (authErr) {
                        console.error('[ZDOS force-pwd] auth update failed', authErr?.status || 'error');
                        state.forcePwd.submitting = false;
                        state.forcePwd.error = '密碼更新失敗，請稍後再試';
                        renderApp(); // stay on screen, must_change_password remains true
                        return;
                    }
                    // Step 3: only after Auth success, flip profile flag. Retry once on failure.
                    let profileSynced = false;
                    const upd1 = await client.from('profiles').update({ must_change_password: false }).eq('id', userId);
                    if (!upd1.error) profileSynced = true;
                    else {
                        console.error('[ZDOS force-pwd] profile sync failed (attempt 1)', upd1.error?.code || 'error');
                        const upd2 = await client.from('profiles').update({ must_change_password: false }).eq('id', userId);
                        if (!upd2.error) profileSynced = true;
                        else console.error('[ZDOS force-pwd] profile sync failed (attempt 2)', upd2.error?.code || 'error');
                    }
                    if (!profileSynced) {
                        // Situation B: Auth updated but profile sync failed — do not enter home.
                        state.forcePwd.submitting = false;
                        state.forcePwd.error = '密碼已更新，但帳號狀態同步失敗。請聯絡系統管理員，請勿重複修改密碼。';
                        renderApp();
                        return;
                    }
                    // Step 4: re-read profile from DB and confirm the flag is now false.
                    const reload = await fetchCloudProfileAndMemberships(userId);
                    if (!reload.ok) {
                        // Situation C or transient: found no profile / query failed.
                        state.forcePwd.submitting = false;
                        state.forcePwd.error = reload.message === '找不到員工資料，請聯絡管理者'
                            ? '找不到對應的人員資料，請聯絡系統管理員。'
                            : (reload.message || '雲端連線失敗，請稍後再試');
                        renderApp();
                        return;
                    }
                    if (reload.profile.must_change_password === true) {
                        state.forcePwd.submitting = false;
                        state.forcePwd.error = '帳號狀態同步失敗，請稍後再試或聯絡系統管理員。';
                        renderApp();
                        return;
                    }
                    // Step 5: clear fields + force-change front-end state.
                    state.mustChangePassword = false;
                    state.forcePwd = { newPassword: '', confirmPassword: '', showNew: false, showConfirm: false, submitting: false, error: '' };
                    // Step 6-7: success message, then finalize login into ZDOS home.
                    const finalize = await hydrateCloudSessionFromUser(state.authUser, null, { silent: true });
                    if (!finalize.ok) {
                        showToast(finalize.message || '登入狀態已失效，請重新登入', 'error');

            fetch(currentConfig.formUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formData.toString() }).then(() => {
                state.salesRecords = state.salesRecords.filter(r => !(r.date === state.newDate && r.shift === state.newShift && r.store === state.storeType));
                state.salesRecords.push({ id: recordId, date: state.newDate, store: state.storeType, shift: state.newShift, employeeId: currentMatched.empId, overAmount: over, salesAmount: sales, expenseNotes: state.newExpenseNotes, expenseAmount: exp, linaPay: lina, twqr: twqr, applePay: apple, netProfit: netCash, mode: 'Google Cloud', ...createSalesRecordReviewFields() });

            const fields = collectBetaFeedbackFields();
            if (!isBetaFeedbackFieldsComplete(fields)) {
                return showToast('請填寫所有必填欄位。', 'error');

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = '送出中…';
            }
            let submitted = false;
            try {
                const formData = buildBetaFeedbackFormData(fields);
                console.log(BETA_FEEDBACK_FORM_URL);
                console.log(formData.toString());
                await fetch(BETA_FEEDBACK_FORM_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                    },
                    body: formData.toString()
                });

                showToast('Beta 回饋已送出', 'success');
                closeBetaFeedbackModal();

                showToast('送出失敗，請稍後再試或檢查網路。', 'error');

        window.exportFullBackup = function() {
            try {
                saveState();
                const payload = { app: 'DAPU OS', version: '1.0.0 Recovery', exportedAt: new Date().toISOString(), localStorage: {} };
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    payload.localStorage[key] = localStorage.getItem(key);
                }
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const now = new Date();
                const pad = n => String(n).padStart(2, '0');
                a.href = url;
                a.download = `DAPU_Backup_${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                showToast('完整備份已下載，請妥善保存。', 'success');
            } catch (err) {
                console.error(err);
                showToast('備份失敗，請重新嘗試。', 'error');
            }
        };

            const file = event.target.files && event.target.files[0];
            if (!file) return;
            if (!confirm('還原會覆蓋目前這台裝置上的帳號、業績、庫存與設定。確定繼續嗎？')) {
                event.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function() {
                try {
                    const payload = JSON.parse(reader.result);
                    if (!payload || !payload.localStorage || typeof payload.localStorage !== 'object') throw new Error('Invalid backup');
                    localStorage.clear();
                    Object.entries(payload.localStorage).forEach(([key, value]) => {
                        if (value !== null && value !== undefined) localStorage.setItem(key, String(value));
                    });
                    alert('還原完成，系統將重新載入。');
                    location.reload();
                } catch (err) {
                    console.error(err);
                    showToast('備份檔格式錯誤，無法還原。', 'error');
                } finally {
                    event.target.value = '';
                }
            };

            const emp = getEmployee(defaultEmployeeId);
            const personnelSched = emp ? getPersonnelDefaultShiftSchedule(emp) : null;
            const defaultStart = existing?.startTime
                || (personnelSched?.ok ? personnelSched.startTime : '')
                || emp?.defaultStartTime

            const defaultWorkShiftType = normalizeWorkShiftProfileKey(
                existing?.workShiftType || emp?.defaultWorkShiftType || '8+1'

                const self = getCurrentUserPersonnel();
                if (!self) return '';
                return `<option value="${escapeHtmlText(self.id)}" selected>${escapeHtmlText(self.name)}（${escapeHtmlText(self.employeeNo)}）</option>`;
            }
            const schedulableEmployees = getSchedulableEmployeesForStore(viewStoreId);
            const seen = new Set();
            const parts = [];
            const pushOption = (value, label, selected) => {
                parts.push(`<option value="${escapeHtmlText(value)}"${selected ? ' selected' : ''}>${label}</option>`);
            };
            schedulableEmployees.forEach(emp => {
                if (!emp?.id || seen.has(emp.id)) return;
                seen.add(emp.id);
                const meta = getSchedulingEmployeeListMeta(emp, viewStoreId);
                const suffix = meta.isSupport ? ' · 支援' : '';
                pushOption(
                    emp.id,
                    `${escapeHtmlText(emp.name)}（${escapeHtmlText(emp.employeeNo)}）${escapeHtmlText(suffix)}`,
                    emp.id === selectedEmployeeId
                );
            });
            if (includeLegacyEmployee && selectedEmployeeId && !seen.has(selectedEmployeeId)) {
                const legacy = getEmployee(selectedEmployeeId);
                if (legacy) {
                    pushOption(
                        legacy.id,
                        `${escapeHtmlText(legacy.name)}（${escapeHtmlText(legacy.employeeNo)}）（目前不可排班）`,
                        true
                    );
                } else {
                    pushOption(
                        selectedEmployeeId,
                        `${escapeHtmlText(selectedEmployeeId)}（目前不可排班）`,
                        true
                    );
                }
            }
            return parts.join('');

        // UI-010C：以前端現有員工與休假資料提供人力參考，不代表正式排班或出勤。
        const getLeaveCenterWorkforceSnapshot = (storeId, dateStr, employeePool = null) => {

            const leaveRows = getLeaveRegistry().filter(row =>
                row.storeId === storeId && row.date === dateStr && ids.has(row.employeeId)
            );
            const leavePeople = new Set(leaveRows.map(row => row.employeeId)).size;
            const total = employees.length;
            const available = Math.max(0, total - leavePeople);
            const ratio = total > 0 ? available / total : 0;
            let level = 'good';
            let label = '人力充足';
            if (total === 0 || ratio < 0.5) { level = 'risk'; label = '人力不足'; }
            else if (ratio < 0.7) { level = 'watch'; label = '接近不足'; }
            return { total, leavePeople, available, ratio, level, label, leaveRows };
        };

        const renderLeaveCapacityBadge = snapshot => `

        // UI-010D：休假總覽篩選（僅 UI 狀態，不改資料結構）
        const getLeaveOverviewFilters = () => ({

        // UI-010E/F/G：個人休假、額度統計與衝突預檢（沿用既有 leave_requests，不新增欄位）
        const getLeaveMonthRowsForEmployee = (employeeId, storeId, year, month, excludeId = null) => {
            const prefix = `${year}-${String(month).padStart(2,'0')}`;
            return getLeaveRegistry().filter(row => row.employeeId === employeeId && row.storeId === storeId && String(row.date || '').startsWith(prefix) && row.id !== excludeId);
        };
        const countLeaveUnits = rows => rows.reduce((sum,row) => sum + (getLeavePeriodFromRow(row) === '全天' ? 1 : .5), 0);
        const getEmployeeLeaveQuotaSnapshot = (employeeId, storeId, year, month, excludeId = null) => {
            const emp = getEmployee(employeeId);
            const rows = getLeaveMonthRowsForEmployee(employeeId, storeId, year, month, excludeId);
            const totalQuota = Number(emp?.monthlyLeaveQuota || 0);
            const choiceQuota = Number(emp?.selfLeaveQuota || 0);
            const companyQuota = Number(emp?.companyLeaveQuota || 0);
            const usedTotal = countLeaveUnits(rows);
            const usedChoice = countLeaveUnits(rows.filter(r => String(r.leaveType || '').trim() === LEAVE_TYPE_VACATION_CHOICE));
            const usedCompany = countLeaveUnits(rows.filter(r => isVacationGeneralLeaveType(r.leaveType)));
            return { emp, rows, totalQuota, choiceQuota, companyQuota, usedTotal, usedChoice, usedCompany,
                remainTotal: Math.max(0,totalQuota-usedTotal), remainChoice: Math.max(0,choiceQuota-usedChoice), remainCompany: Math.max(0,companyQuota-usedCompany) };
        };
        const renderLeaveQuotaSnapshotHtml = snapshot => {
            if (!snapshot?.emp) return '<p class="zdos-leave-create-quota-note">找不到員工額度資料。</p>';
            const fmt = n => {
                const v = Number(n);
                return Number.isFinite(v) ? String(v) : '0';
            };
            return `<p class="zdos-leave-create-quota-line">休假額度：每月 ${fmt(snapshot.usedTotal)}/${fmt(snapshot.totalQuota)}｜公司排休 ${fmt(snapshot.usedCompany)}/${fmt(snapshot.companyQuota)}｜自選休 ${fmt(snapshot.usedChoice)}/${fmt(snapshot.choiceQuota)}</p><p class="zdos-leave-create-quota-note">額度僅供提示，不會自動改變雲端資料。</p>`;
        };
        const findDetailedLeaveConflict = ({employeeId,storeId,date,period='全天',excludeId=null}) => {
            return getLeaveRegistry().find(row => row.id !== excludeId && row.employeeId === employeeId && row.storeId === storeId && row.date === date && leavePeriodsConflict(getLeavePeriodFromRow(row),period)) || null;
        };
        const MAX_LEAVE_RANGE_DAYS = 62;
        const getViewMonthBounds = (year, month) => {
            const y = Number(year);
            const m = Number(month);
            const prefix = `${y}-${String(m).padStart(2, '0')}`;
            const lastDay = new Date(y, m, 0).getDate();
            return {
                first: `${prefix}-01`,
                last: `${prefix}-${String(lastDay).padStart(2, '0')}`,
                prefix
            };
        };
        const countInclusiveDays = (start, end) => {
            const cursor = new Date(`${start}T12:00:00`);
            const last = new Date(`${end}T12:00:00`);
            if (Number.isNaN(cursor.getTime()) || Number.isNaN(last.getTime())) return null;
            return Math.floor((last - cursor) / 86400000) + 1;
        };
        const buildInclusiveDateList = (start, end) => {
            const rows = [];
            const cursor = new Date(`${start}T12:00:00`);
            const last = new Date(`${end}T12:00:00`);
            if (Number.isNaN(cursor.getTime()) || Number.isNaN(last.getTime()) || cursor > last) return rows;
            while (cursor <= last) {
                rows.push(cursor.toISOString().slice(0, 10));
                cursor.setDate(cursor.getDate() + 1);
            }
            return rows;
        };
        const resolveLeaveFormDateList = (start, end, dateMode = 'single') => {
            if (!start) return { ok: false, message: '請完整填寫排假資料。', dates: [] };
            const effectiveEnd = dateMode === 'range' ? end : start;
            if (dateMode === 'range') {
                if (!effectiveEnd) return { ok: false, message: '請完整填寫排假資料。', dates: [] };
                if (effectiveEnd < start) return { ok: false, message: '結束日期不得早於開始日期。', dates: [] };
                const dayCount = countInclusiveDays(start, effectiveEnd);
                if (dayCount === null) return { ok: false, message: '日期格式不正確。', dates: [] };
                if (dayCount > MAX_LEAVE_RANGE_DAYS) {
                    return { ok: false, message: '連續休假一次最多可安排 62 天。', dates: [] };
                }
            }
            return { ok: true, dates: buildInclusiveDateList(start, effectiveEnd), message: '' };
        };
        const inferLeaveFormScope = (dateIso, year, month) => {
            if (!dateIso) return 'current';
            const { first, last } = getViewMonthBounds(year, month);
            if (dateIso > last) return 'future';
            if (dateIso >= first && dateIso <= last) return 'current';
            return 'current';
        };
        const validateLeaveFormScope = (scope, dates, year, month) => {
            if (!Array.isArray(dates) || !dates.length) {
                return { ok: false, message: '請完整填寫排假資料。' };
            }
            const { first, last } = getViewMonthBounds(year, month);
            if (scope === 'future') {
                if (dates.some(d => d <= last)) {
                    return { ok: false, message: '預排假必須安排在目前月份之後。' };
                }
                return { ok: true };
            }
            // 本月休假：單日／連續皆須落在目前查看月份，不可跨月
            if (dates.some(d => d < first || d > last)) {
                return { ok: false, message: '本月休假只能安排在目前查看的月份。' };
            }
            return { ok: true };
        };
        window.refreshLeaveFormInsights = function() {
            const employeeId=document.getElementById('leave-form-employee')?.value;
            const start=document.getElementById('leave-form-date')?.value;
            const end=document.getElementById('leave-form-end-date')?.value || start;
            const mode=document.querySelector('input[name="leave-form-date-mode"]:checked')?.value || 'single';
            const leaveScope=document.querySelector('input[name="leave-form-scope"]:checked')?.value || 'current';
            const period=document.querySelector('input[name="leave-form-period"]:checked')?.value || '全天';
            const storeId=getSchedulingViewStoreId();
            const quota=document.getElementById('leave-form-quota-content');
            const conflict=document.getElementById('leave-form-conflict');
            if (!employeeId || !storeId || !start) return;
            const d=new Date(`${start}T12:00:00`);
            const snapshot=getEmployeeLeaveQuotaSnapshot(employeeId,storeId,d.getFullYear(),d.getMonth()+1,state.leaveModal?.leaveId || null);
            if (quota) quota.innerHTML=renderLeaveQuotaSnapshotHtml(snapshot);
            const rangeResolved = resolveLeaveFormDateList(start, end, mode);
            if (!rangeResolved.ok) {
                if (conflict) {
                    conflict.classList.add('is-visible');
                    conflict.textContent = rangeResolved.message;
                }
                return;
            }
            const dates = rangeResolved.dates;
            const scopeCheck = validateLeaveFormScope(leaveScope, dates, state.schedule?.year, state.schedule?.month);
            const hits=dates.map(date=>({date,row:findDetailedLeaveConflict({employeeId,storeId,date,period,excludeId:state.leaveModal?.leaveId || null})})).filter(x=>x.row);
            if (conflict) {
                if (!scopeCheck.ok) {
                    conflict.classList.add('is-visible');
                    conflict.textContent = scopeCheck.message;
                } else {
                    conflict.classList.toggle('is-visible',hits.length>0);
                    conflict.textContent=hits.length ? `發現 ${hits.length} 個日期與既有休假重疊：${hits.slice(0,5).map(x=>x.date).join('、')}${hits.length>5?'…':''}` : '';
                }
            }
        };

        // ========================================================================
        // 13. 應用程式自動載入引導
        // ========================================================================
        /**
         * Brand Opening — 創辦人正式影片 345.mp4（主路徑）。
         * 播完／Skip → enterAppAfterBoot（不等 Auth）。
         * 僅影片無法播放時，才用 Logo＋AI 小天靜態保底。
         */
        const ZDOS_BOOT_SPLASH = {
            /** 創辦人最新 Opening；硬逾時由 loadedmetadata 依真實 duration 調整 */
            hardTimeoutMs: 12000,
            fallbackMs: 2200,
            reducedMs: 1400,
            holdEndMs: 200,
            exitMs: 400
        };

        function stopBootSplashVideo(video) {
            if (!video) return;
            try { video.pause(); } catch (_) { /* ignore */ }
            try {
                video.removeAttribute('autoplay');
                video.loop = false;
            } catch (_) { /* ignore */ }
        }

        function cleanupBootSplashVideo(video) {
            if (!video) return;
            stopBootSplashVideo(video);
            try {
                video.removeAttribute('src');
                while (video.firstChild) video.removeChild(video.firstChild);
                video.load();
            } catch (_) { /* ignore */ }
        }

        function dismissBootSplashElement(el) {
            return new Promise((resolve) => {
                const clearActive = () => {
                    try { document.documentElement.classList.remove('zdos-boot-splash-active'); } catch (_) { /* ignore */ }
                };
                if (!el || el.hasAttribute('hidden') || el.classList.contains('zdos-boot-splash--done')) {
                    clearActive();
                    resolve();
                    return;
                }
                const video = el.querySelector('[data-boot-splash-video]');
                stopBootSplashVideo(video);
                el.classList.add('zdos-boot-splash--exit');
                clearActive();
                window.setTimeout(() => {
                    el.classList.add('zdos-boot-splash--done');
                    el.setAttribute('hidden', '');
                    el.setAttribute('aria-hidden', 'true');
                    el.style.display = 'none';
                    cleanupBootSplashVideo(video);
                    resolve();
                }, ZDOS_BOOT_SPLASH.exitMs);
            });
        }

        function runBootSplash() {
            return new Promise((resolve) => {
                let settled = false;
                let hardTimer = null;
                let fallbackTimer = null;
                let holdTimer = null;
                let canplayTimer = null;
                let usingFallback = false;
                let playAttempt = 0;

                const record = (reason, detail) => {
                    try {
                        window.__ZDOS_BOOT_SPLASH = {
                            reason: reason || 'done',
                            detail: detail || null,
                            mode: usingFallback ? 'fallback' : 'video',
                            at: Date.now()
                        };
                        const el = document.getElementById('zdos-boot-splash');
                        if (el) {
                            el.setAttribute('data-boot-reason', reason || 'done');
                            if (detail) el.setAttribute('data-boot-detail', String(detail).slice(0, 160));
                        }
                    } catch (_) { /* ignore */ }
                };

                const finish = (reason, detail) => {
                    if (settled) return;
                    settled = true;
                    if (hardTimer) window.clearTimeout(hardTimer);
                    if (fallbackTimer) window.clearTimeout(fallbackTimer);
                    if (holdTimer) window.clearTimeout(holdTimer);
                    if (canplayTimer) window.clearTimeout(canplayTimer);
                    record(reason || 'done', detail);
                    resolve(reason || 'done');
                };

                const pauseThenFinish = (video, reason) => {
                    if (settled) return;
                    stopBootSplashVideo(video);
                    holdTimer = window.setTimeout(() => finish(reason), ZDOS_BOOT_SPLASH.holdEndMs);
                };

                /** 最後保底：Logo＋AI 小天（不得作為主要開場） */
                const startFallbackAnimation = (el, reason, detail) => {
                    try {
                        usingFallback = true;
                        record(reason || 'fallback', detail);
                        const video = el.querySelector('[data-boot-splash-video]');
                        if (video) {
                            stopBootSplashVideo(video);
                            video.setAttribute('hidden', '');
                        }
                        el.classList.add('zdos-boot-splash--fallback');
                        const stage = el.querySelector('[data-boot-splash-fallback]');
                        if (stage) stage.removeAttribute('hidden');

                        let reduceMotion = false;
                        try {
                            reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                        } catch (_) {
                            reduceMotion = false;
                        }
                        const playMs = (reason === 'reduced-motion' || reduceMotion)
                            ? ZDOS_BOOT_SPLASH.reducedMs
                            : ZDOS_BOOT_SPLASH.fallbackMs;
                        fallbackTimer = window.setTimeout(() => finish(reason || 'fallback-complete', detail), playMs);
                    } catch (err) {
                        console.warn('[ZDOS brand-opening] fallback failed', err);
                        finish('fallback-exception', String(err && err.message || err));
                    }
                };

                try {
                    const el = document.getElementById('zdos-boot-splash');
                    if (!el) {
                        finish('missing-overlay');
                        return;
                    }

                    hardTimer = window.setTimeout(() => finish('timeout'), ZDOS_BOOT_SPLASH.hardTimeoutMs);

                    const skipBtn = el.querySelector('[data-boot-splash-skip]');
                    if (skipBtn) {
                        skipBtn.addEventListener('click', () => {
                            const video = el.querySelector('[data-boot-splash-video]');
                            stopBootSplashVideo(video);
                            finish('skip');
                        }, { once: true });
                    }

                    let reduceMotion = false;
                    try {
                        reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                    } catch (_) {
                        reduceMotion = false;
                    }
                    if (reduceMotion) {
                        startFallbackAnimation(el, 'reduced-motion');
                        return;
                    }

                    const video = el.querySelector('[data-boot-splash-video]');
                    if (!video) {
                        startFallbackAnimation(el, 'missing-video');
                        return;
                    }

                    const armVideoAttrs = () => {
                        video.loop = false;
                        video.muted = true;
                        video.defaultMuted = true;
                        video.playsInline = true;
                        try {
                            video.setAttribute('muted', '');
                            video.setAttribute('playsinline', '');
                            video.setAttribute('webkit-playsinline', '');
                            video.setAttribute('autoplay', '');
                        } catch (_) { /* ignore */ }
                    };
                    armVideoAttrs();

                    const enterFallback = (reason, detail) => {
                        if (settled || usingFallback) return;
                        startFallbackAnimation(el, reason, detail);
                    };

                    // 依真實 duration 調整硬逾時（創辦人片約 14.8s）
                    const bumpHardTimeoutFromMeta = () => {
                        try {
                            const d = video.duration;
                            if (!Number.isFinite(d) || d <= 0) return;
                            if (hardTimer) window.clearTimeout(hardTimer);
                            const ms = Math.min(30000, Math.ceil(d * 1000) + 3500);
                            hardTimer = window.setTimeout(() => finish('timeout'), ms);
                        } catch (_) { /* ignore */ }
                    };
                    video.addEventListener('loadedmetadata', bumpHardTimeoutFromMeta, { once: true });

                    video.addEventListener('error', () => {
                        const mediaErr = video.error;
                        const code = mediaErr ? mediaErr.code : null;
                        enterFallback('video-error', `MediaError code=${code}`);
                    }, { once: true });

                    video.addEventListener('ended', () => {
                        if (settled || usingFallback) return;
                        pauseThenFinish(video, 'video-ended');
                    }, { once: true });

                    if (video.ended) {
                        pauseThenFinish(video, 'video-ended-early');
                        return;
                    }

                    let playStarted = false;
                    const tryPlay = (isRetry) => {
                        if (settled || usingFallback) return;
                        if (playStarted && !isRetry) return;
                        playStarted = true;
                        playAttempt += 1;
                        armVideoAttrs();
                        const p = video.play();
                        if (p && typeof p.then === 'function') {
                            p.then(() => {
                                record(isRetry ? 'play-retry-ok' : 'play-ok');
                            }).catch((err) => {
                                const msg = String((err && err.name) || err || 'play-failed');
                                if (!isRetry && playAttempt < 2) {
                                    record('play-reject-retry', msg);
                                    window.setTimeout(() => tryPlay(true), 80);
                                    return;
                                }
                                enterFallback('play-reject', msg);
                            });
                        }
                    };

                    if (video.readyState >= 2) {
                        tryPlay(false);
                    } else {
                        video.addEventListener('loadeddata', () => tryPlay(false), { once: true });
                        video.addEventListener('canplay', () => tryPlay(false), { once: true });
                        canplayTimer = window.setTimeout(() => {
                            if (settled || usingFallback) return;
                            if (video.readyState < 2) {
                                enterFallback('canplay-timeout', `readyState=${video.readyState}`);
                            }
                        }, 4000);
                    }
                } catch (err) {
                    console.warn('[ZDOS brand-opening] failed; fallback', err);
                    try {
                        const el = document.getElementById('zdos-boot-splash');
                        if (el) startFallbackAnimation(el, 'exception', String(err && err.message || err));
                        else finish('exception', String(err && err.message || err));
                    } catch (_) {
                        finish('exception');
                    }
                }
            });
        }

        function isBootSplashDone() {
            const splash = document.getElementById('zdos-boot-splash');
            if (!splash) return true;
            return splash.hasAttribute('hidden')
                || splash.classList.contains('zdos-boot-splash--done')
                || splash.style.display === 'none';
        }

        async function enterAppAfterBoot() {
            // 進登入／首頁：不依賴 Auth 完成；未登入一律先到登入入口
            try {
                if (isSalesCloudEnabled() && !state.supabaseSessionReady) {
                    state.isLoggedIn = false;
                }
                renderApp();
            } catch (err) {
                console.error('[ZDOS boot] renderApp failed after splash', err);
            }
            await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
            try {
                await dismissBootSplashElement(document.getElementById('zdos-boot-splash'));
            } catch (_) {
                try { document.documentElement.classList.remove('zdos-boot-splash-active'); } catch (__) { /* ignore */ }
            }
            // 再確保登入畫面可見（防黑畫面）
            try {
                document.documentElement.classList.remove('zdos-boot-splash-active');
                if (!state.isLoggedIn) renderApp();
            } catch (_) { /* ignore */ }
            // 版本公告在登入入口之上（可點「開始登入」）；不阻擋登入層已繪製
            try {
                maybeShowUpdateModal();
            } catch (_) {
                /* ignore */
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            state.accounts = loadSyncedAccounts();
            updateGlobalGlows();

            const splashReady = runBootSplash();

            let authReady;
            if (isSalesCloudEnabled()) {
                state.isLoggedIn = false;
                authReady = initCloudAuthOnBoot().then(() => {
                    if (state.supabaseSessionReady) void refreshAccountCenterDirectory();
                }).catch((err) => {
                    console.error('[ZDOS boot] initCloudAuthOnBoot failed', err);
                });
            } else {
                authReady = Promise.resolve();
            }

            // 關鍵：Splash／Skip 結束立即進登入，不等 Auth
            splashReady.then(() => enterAppAfterBoot()).catch(() => enterAppAfterBoot());

            // Auth 完成後再刷新（若已登入則進首頁；Splash 已結束才 render）
            authReady.then(() => {
                if (!isBootSplashDone()) return;
                try { renderApp(); } catch (_) { /* ignore */ }
            });
        });
    </script>
