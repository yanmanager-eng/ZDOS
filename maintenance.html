<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#061428">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ZDOS v1.5 系統升級中</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="ui/assets/brand/zdos-product-logo.png" type="image/png">
  <link rel="stylesheet" href="ui/maintenance.css">
</head>
<body>
  <main class="maint" role="main" aria-label="ZDOS 系統升級維護頁">
    <div class="maint__bg" aria-hidden="true"></div>
    <div class="maint__inner">
      <header class="maint__brand">
        <img
          class="maint__logo"
          src="ui/assets/brand/zdos-product-logo.png"
          width="64"
          height="64"
          alt="ZDOS"
          decoding="async"
        >
        <div class="maint__brand-text">
          <strong>ZDOS</strong>
          <span>智能營運系統</span>
        </div>
      </header>

      <section class="maint__status" aria-label="系統狀態">
        <p class="maint__badge">🚧 系統升級中</p>
        <h1 class="maint__title">ZDOS v1.5 正式版</h1>
        <p class="maint__subtitle">正在進行最後部署</p>
      </section>

      <section class="maint__hero" aria-label="AI 絲絲">
        <img
          class="maint__sisi"
          src="ui/assets/brand/ai-sisi-welcome.jpg"
          width="280"
          height="280"
          alt="AI 絲絲"
          decoding="async"
        >
        <p class="maint__sisi-name">AI 絲絲</p>
        <blockquote class="maint__quote">
          「再等一下，<br>我們正在把 ZDOS<br>變得更完整。」
        </blockquote>
      </section>

      <section class="maint__progress" aria-label="升級進度">
        <div class="maint__progress-head">
          <h2>進度</h2>
          <span>82%</span>
        </div>
        <div class="maint__bar" role="progressbar" aria-valuenow="82" aria-valuemin="0" aria-valuemax="100">
          <span style="width:82%"></span>
        </div>
        <div class="maint__eta">
          <p class="maint__eta-label">預計完成</p>
          <p class="maint__eta-value">2026/07/31<br>16:00</p>
        </div>
      </section>

      <section class="maint__updates" aria-labelledby="maint-updates-title">
        <h2 id="maint-updates-title">本次更新</h2>
        <ul>
          <li>首頁</li>
          <li>人力中心</li>
          <li>排假中心</li>
          <li>業績中心</li>
          <li>AI</li>
          <li>推播</li>
        </ul>
      </section>

      <footer class="maint__footer">
        <p>感謝您的耐心等待</p>
      </footer>
    </div>
  </main>
</body>
</html>
